<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة تحليل الكلمات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f1ff;--card:#fff;--ink:#16324f;--tile:#ffd23f;--ok:#2fbf71;--bad:#ff6b6b;--pri:#1f7ae0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12263d;--card:#1d3a5a;--ink:#f2f8ff;--pri:#5aa8ff}}
:root[data-theme="dark"]{--bg:#12263d;--card:#1d3a5a;--ink:#f2f8ff;--pri:#5aa8ff}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-weight:500;text-align:center;-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;padding:12px 14px 12px}
h1{font-size:28px;margin:10px 0 2px;font-weight:800}
h2{font-size:18px;margin:18px 0 8px;font-weight:800;text-align:right}
.sub{opacity:.8;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border:3px solid var(--pri);border-radius:20px;padding:8px 2px;font:inherit;color:inherit;cursor:pointer}
.card .e{font-size:34px;line-height:1.2}.card .w{font-size:25px;font-weight:800;line-height:1.9}.card .s{font-size:15px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.home{font-size:24px;background:var(--card);border:2px solid var(--pri);border-radius:14px;padding:4px 12px;cursor:pointer}
.badge{background:var(--tile);color:#16324f;border-radius:999px;padding:4px 14px;font-size:15px}
.pic{font-size:72px;line-height:1.2;margin-top:6px}
.hear{font-size:26px;background:var(--card);border:2px solid var(--pri);border-radius:50%;width:48px;height:48px;cursor:pointer}
.word{font-size:62px;font-weight:800;line-height:2;min-height:100px}
.wr{display:flex;justify-content:center;gap:18px;direction:rtl;flex-wrap:wrap;font-size:42px}.wr span{unicode-bidi:isolate}
.slots{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0}
.slot{min-width:104px;height:78px;padding:0 6px;border:3px dashed var(--pri);border-radius:16px;font-size:32px;font-weight:800;line-height:84px;background:var(--card);white-space:nowrap}
.slot.p{border:3px solid var(--ok)}
.slot.f{border:3px solid var(--ok);background:#d6f5e3;color:#16324f}
.slot.no{border-color:var(--bad);animation:sh .4s}
.msg{font-size:21px;font-weight:800;margin:10px 0;min-height:34px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.tile{min-width:78px;height:84px;font:inherit;font-size:40px;font-weight:800;line-height:1.7;color:#16324f;background:var(--tile);border:0;border-bottom:6px solid #d9a800;border-radius:20px;cursor:grab;padding:0 10px;touch-action:none}
.tile.d{background:#ffb3c1;border-bottom-color:#e07a90}
.tile[disabled]{opacity:.2;pointer-events:none}
.ghost{position:fixed;z-index:9;pointer-events:none;margin:0;transform:scale(1.12);box-shadow:0 8px 18px rgba(0,0,0,.3)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn{font:inherit;font-size:22px;font-weight:800;background:var(--pri);color:#fff;border:0;border-radius:18px;padding:12px 26px;margin:6px;cursor:pointer}
.stars{font-size:56px;letter-spacing:6px}
.inp{font:inherit;font-size:26px;text-align:center;border:3px solid var(--pri);border-radius:16px;padding:10px;width:80%;max-width:320px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.rule{background:var(--card);border:3px solid var(--pri);border-radius:20px;padding:12px;margin:12px 0;font-size:18px;line-height:1.7}
.heroes{display:flex;justify-content:space-around;margin-bottom:8px;font-size:15px;font-weight:800}
.heroes svg{width:76px;height:76px;vertical-align:middle}.fl{display:inline-block;transform:scaleX(-1)}
.ex{display:flex;justify-content:center;margin-top:6px;gap:0}
.ex .slot{min-width:56px;height:62px;line-height:66px;border-radius:0;margin:0 -1.5px;font-size:30px}
.ex .slot:first-child{border-radius:0 16px 16px 0}.ex .slot:last-child{border-radius:16px 0 0 16px}.ex .slot:only-child{border-radius:16px}
.ex .dep{background:#ffe3ea;color:#16324f}
.tm{height:14px;background:var(--card);border:2px solid var(--pri);border-radius:999px;overflow:hidden;margin:8px 0 2px}.tm i{display:block;height:100%;background:var(--ok)}
.bar{height:26px;background:var(--card);border:3px solid var(--pri);border-radius:999px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:38px;font-weight:800}
.snap{background:var(--tile);color:#16324f;border-radius:18px;padding:12px;font-size:20px;font-weight:800;margin:12px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.pp{background:var(--card);color:var(--ink);border-radius:22px;padding:16px;max-width:420px;width:100%;text-align:right;font-size:18px;line-height:1.7}
.pp .r{padding:8px 10px;border-radius:14px;margin:6px 0}.pp .r.h{background:var(--tile);color:#16324f}
.pp .btn{display:block;margin:10px auto 0}
footer{margin-top:10px;font-weight:800;opacity:.85;padding-bottom:16px;text-align:center}
@media (prefers-reduced-motion:reduce){.slot.no{animation:none}}
</style></head><body><div id="app"></div><footer>إعداد أ. مصطفى الهتلان</footer>
<script>
const T=['ثلاثية متحركة','فيها مد','فيها سكون'];
const D=(e,g,l)=>{const a=l.split(' ');a[a.length-1]+='\u064C';return{e,t:T[g],l:a,w:a.join('')}};
const W=[
D('🌙',0,'قَ مَ ر'),D('✏️',0,'قَ لَ م'),D('🐄',0,'بَ قَ ر'),D('🐴',0,'فَ رَ س'),
D('🚪',1,'بَ ا ب'),D('🏠',1,'دَ ا ر'),D('🐘',1,'فِ ي ل'),D('☀️',1,'نُ و ر'),
D('🕊️',1,'حَ مَ ا م'),D('👕',1,'قَ مِ ي ص'),D('👅',1,'لِ سَ ا ن'),D('🛏️',1,'سَ رِ ي ر'),
D('🌳',1,'بُ سْ تَ ا ن'),D('🔦',1,'مِ صْ بَ ا ح'),D('🔑',1,'مِ فْ تَ ا ح'),D('🏮',1,'فَ ا نُ و س'),D('🕯️',1,'قِ نْ دِ ي ل'),
D('🌊',2,'بَ حْ ر'),D('❤️',2,'قَ لْ ب'),D('🐅',2,'نَ مْ ر'),D('📓',2,'دَ فْ تَ ر'),
D('🧂',2,'مِ لْ ح'),D('🐝',2,'نَ حْ ل'),D('🐒',2,'قِ رْ د'),D('🦅',2,'صَ قْ ر'),
D('🏰',2,'قَ صْ ر'),D('🥩',2,'لَ حْ م'),D('🏖️',2,'رَ مْ ل')];
const app=document.getElementById('app');
let cur,mist=0,done={},TM=null,S={name:'',total:0,first:0,right:0,wrong:0,words:new Set(),jt:0,je:0};
const stopT=()=>clearInterval(TM);
const sh=a=>[...a].sort(()=>Math.random()-.5);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.75;speechSynthesis.speak(u)}catch(e){}};
const MK=/[\u064B-\u0652]/g,NC='ادذرزوة',lb=u=>{const t=u.replace(MK,'');return t[t.length-1]},cn=u=>!NC.includes(lb(u));
const shape=(u,a,b)=>(a?'ـ':'')+u+(b&&cn(u)?'ـ':''),posn=(a,i)=>shape(a[i],i>0&&cn(a[i-1]),i<a.length-1);
const dep=u=>/\u0652/.test(u)||(u.length==1&&'اوي'.includes(u)),kind=u=>/\u0652/.test(u)?3:dep(u)?2:1;
function intro(){
  app.innerHTML=`<div class=pic style="margin-top:24px">🔤</div><h1>لعبة تحليل الكلمات</h1><p class=sub>الصف الأول الابتدائي</p><p class=msg style="margin:18px 0 8px">اكتب اسمك</p><input id=nm class=inp maxlength=30 placeholder="اكتب اسمك هنا" autocomplete=off><div id=er class=msg></div><button class=btn onclick=go()>ابدأ ▶</button>`;
}
function go(){const e=document.getElementById('nm'),v=e.value.trim();if(!v){document.getElementById('er').textContent='✏️ اكتب اسمك أولًا لتدخل اللعبة';e.focus();return}S.name=v;rules()}
const hero=(m,n)=>`<div><span>💪</span><svg viewBox="0 0 100 100"><text x="50" y="40" text-anchor="middle" font-size="46" fill="currentColor">${m}</text><circle cx="50" cy="68" r="26" fill="#ffd23f"/><circle cx="41" cy="62" r="3.5" fill="#16324f"/><circle cx="59" cy="62" r="3.5" fill="#16324f"/><path d="M32 74q9-9 18 0q9-9 18 0q-9 10-18 3q-9 7-18-3z" fill="#5a3a1a"/></svg><span class=fl>💪</span><br>${n}</div>`;
function rules(){
  app.innerHTML=`<h1>📜 قوانين الحروف</h1>
  <div class=rule><div class=heroes>${hero('ـَ','فتحة')}${hero('ـُ','ضمة')}${hero('ـِ','كسرة')}</div><b>١) الحرف المتحرك قويّ 💪</b><br>يقف في بيت لوحده<div class=ex><span class=slot>بَ</span></div></div>
  <div class=rule><b>٢) حرف المد ضعيف 🥺</b><br>حروف المد: ا و ي. لا تقف وحدها، تستند على الحرف المتحرك قبلها<div class=ex><span class=slot>بَـ ـا</span></div></div>
  <div class=rule><b>٣) الحرف الساكن خجول 🙈</b><br>يستند على الحرف المتحرك قبله<div class=ex><span class=slot>بَـ ـحْ</span></div></div>
  <button class=btn onclick=home()>فهمت! هيا نلعب ▶</button>`;
}
function home(){
  stopT();
  let h=`<h1>🔤 أهلًا يا ${esc(S.name)}</h1><p class=sub>اختر كلمة لتبدأ</p><button class=btn onclick=rules()>📜 القوانين</button>`+(S.total?`<button class=btn style="background:var(--ok)" onclick=result()>🏁 إنهاء وعرض النتيجة</button>`:'');
  T.forEach(t=>{h+=`<h2>${t}</h2><div class=grid>`+W.map((x,i)=>x.t==t?`<button class=card onclick="play(${i})"><div class=e>${x.e}</div><div class=w>${x.w}</div><div class=s>${done[x.w]?'⭐'.repeat(done[x.w]):''}</div></button>`:'').join('')+`</div>`});
  app.innerHTML=h;
}
function pop(hi,cb){
  stopT();const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class=pp><h2 style="margin:0 0 8px;text-align:center">📜 تذكّر القوانين</h2><div class="r ${hi==1?'h':''}">💪 <b>الحرف المتحرك قويّ:</b> يقف في بيت لوحده</div><div class="r ${hi==2?'h':''}">🥺 <b>حرف المد (ا و ي) ضعيف:</b> يستند على الحرف المتحرك قبله</div><div class="r ${hi==3?'h':''}">🙈 <b>الحرف الساكن خجول:</b> يستند على الحرف المتحرك قبله</div><button class=btn>فهمت ✔</button></div>`;
  d.querySelector('button').onclick=()=>{d.remove();cb()};document.body.appendChild(d);
}
function play(i){
  stopT();cur=W[i];mist=0;
  const ex=cur.l,LIM=cur.t==T[0]?10:15,DS=ex.map((_,k)=>posn(ex,k)),HS=[],hof=[],need=[];
  ex.forEach((x,k)=>{if(HS.length&&dep(x)){HS[HS.length-1].push(k);need.push(k)}else HS.push([k])});
  HS.forEach((h,j)=>h.forEach(k=>hof[k]=j));
  let fl=ex.map(()=>0),bad=-1,ws=new Set(),left=LIM,ord=ex.map((_,k)=>k),msg='🐥 ضع كل حرف في مربعه: الضعيف والخجول يجلسان مع المتحرك قبلهما';
  const bx=h=>{const g=HS[h].filter(k=>fl[k]);return `<span class="slot ${g.length==HS[h].length?'f':g.length?'p':''} ${h==bad?'no':''}" data-i="${h}">${g.map(k=>DS[k]).join('')}</span>`};
  const draw=()=>{
    app.innerHTML=`<div class=top><button class=home onclick=home()>🏠</button><span class=badge>${cur.t}</span><span>${fl.filter(x=>x).length} / ${ex.length}</span></div>
    <div class=pic>${cur.e}</div>
    <div class="word wr">${DS.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class=slots>${HS.map((_,h)=>bx(h)).join('')}</div>
    <div class=tm><i id=tb style="width:${left/LIM*100}%"></i></div><div class=sub>⏱ <b id=tt>${Math.ceil(left)}</b> ثانية</div>
    <div class=msg>${msg}</div>
    <div class=tiles>${ord.map(k=>`<button class="tile ${dep(ex[k])?'d':''}" data-i="${k}" ${fl[k]?'disabled':''}>${DS[k]}</button>`).join('')}</div>
    <p><button class=hear onclick="say(cur.w)">🔊</button></p>`;
    bad=-1;
  };
  const rst=()=>{left=LIM;stopT();TM=setInterval(()=>{left-=.1;const b=document.getElementById('tb'),t=document.getElementById('tt');if(b){b.style.width=Math.max(0,left/LIM*100)+'%';b.style.background=left<3?'var(--bad)':'var(--ok)'}if(t)t.textContent=Math.max(0,Math.ceil(left));if(left<=0)tout()},100)};
  const fin=()=>{
    stopT();S.total+=ex.length;S.first+=ex.length-ws.size;S.jt+=need.length;S.je+=need.filter(k=>ws.has(k)).length;S.words.add(cur.w);
    msg='🎉 أحسنت!';draw();setTimeout(()=>say(cur.w),600);setTimeout(()=>end(i),2200);
  };
  const after=()=>{if(fl.every(x=>x))fin();else{rst();draw()}};
  const tout=()=>{mist++;S.wrong++;const k=fl.indexOf(0);fl[k]=1;ws.add(k);msg='⏰ انتهى الوقت! هذا هو الصحيح';after()};
  window.drop=(k,h)=>{
    if(fl[k])return;
    if(hof[k]==h){fl[k]=1;S.right++;say(ex[k]);msg='👏 صح!';after()}
    else{mist++;S.wrong++;ws.add(k);bad=h;msg='🤔 ليس هذا المكان، جرّب مرة ثانية';draw();pop(kind(ex[k]),()=>{rst();draw()})}
  };
  rst();draw();setTimeout(()=>say(cur.w),300);
}
let drag=null;
const mv=e=>{if(drag){drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px'}};
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.tile');if(!b||b.disabled)return;
  e.preventDefault();
  const r=b.getBoundingClientRect(),g=b.cloneNode(true);
  g.className='tile ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';
  document.body.appendChild(g);
  drag={b,g,dx:r.width/2,dy:r.height/2,id:+b.dataset.i};
  b.style.opacity=.3;mv(e);
});
document.addEventListener('pointermove',mv);
const endDrag=(e,ok)=>{
  if(!drag)return;const d=drag;drag=null;
  d.g.style.display='none';
  const el=ok?document.elementFromPoint(e.clientX,e.clientY):null;
  d.g.remove();d.b.style.opacity='';
  const s=el&&el.closest('.slot');
  if(s&&s.dataset.i!==undefined&&window.drop)window.drop(d.id,+s.dataset.i);
};
document.addEventListener('pointerup',e=>endDrag(e,true));
document.addEventListener('pointercancel',e=>endDrag(e,false));
const stats=()=>{const t=S.right+S.wrong,p=t?Math.round(S.right*100/t):0;return{p,lv:p>=90?'متقن 🌟':p>=70?'جيد 👍':'يحتاج تدريب 💪'}};
function result(){sendResultToParent();
  stopT();const{p,lv}=stats(),jp=S.jt?Math.round((S.jt-S.je)*100/S.jt):null;
  app.innerHTML=`<div class=pic style="margin-top:14px">🏆</div><h1>${esc(S.name)}</h1><div class=big>الدرجة: ${S.first} من ${S.total}</div><p>نسبة إتقان المهارة: <b>${p}%</b></p><div class=bar><i style="width:${p}%"></i></div><div class=msg>${lv}</div>`+(jp!=null?`<p>فهم ربط المد والسكون: <b>${jp}%</b></p>`:'')+`<p class=sub>${new Date().toLocaleDateString('ar-SA')} · عدد الكلمات: ${S.words.size}</p><div class=snap>📸 صوّر هذه الشاشة وأرسلها إلى معلمك</div><button class=btn style="background:var(--ok)" onclick=home()>رجوع</button>`;
}
function end(i){
  const n=mist==0?3:mist<3?2:1;done[cur.w]=Math.max(done[cur.w]||0,n);
  const nx=(i+1)%W.length;
  app.innerHTML=`<div class=pic style="margin-top:30px">${cur.e}</div><div class=word style="min-height:0">${cur.w}</div>
  <div class=stars>${'⭐'.repeat(n)}</div><div class=msg>🥳 ممتاز! أنهيت الكلمة</div>
  <button class=btn onclick="play(${nx})">الكلمة التالية</button><button class=btn style="background:#ff8a3d" onclick="play(${i})">أعد اللعب</button><br><button class=btn style="background:var(--ok)" onclick="home()">كل الكلمات</button><button class=btn style="background:#8a4fd8" onclick="result()">🏁 النتيجة</button>`;
  say('ممتاز');sendResultToParent();
}
// Send result to parent site
function sendResultToParent(){const{p,lv}=stats();try{window.parent.postMessage({type:'GAME_RESULT',name:S.name,score:S.first,total:S.total,pct:p,level:lv,words:S.words.size},'*');}catch(e){}}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='SET_PLAYER'&&e.data.name){var el=document.getElementById('nm');if(el){el.value=e.data.name;}}});
intro();
</script></body></html>
