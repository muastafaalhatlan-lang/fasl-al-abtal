<title>منصة فصل الأبطال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
/* Layout: لوحة بشريط جانبي يمين (RTL) كما في الموقع المرجعي، بطاقات ملونة كبيرة تناسب الطفل */
:root{
  --bg:#EAF5FF; --bg-dot:#D3E9FF; --surface:#FFFFFF; --surface-2:#F4F9FF; --ink:#1B2A4A; --muted:#5A6B8E; --line:#DCE7F5;
  --sky:#2F8FF7; --sun:#FFC23D; --grass:#2FB872; --coral:#FF6B5E; --grape:#8A63F0; --orange:#FF9433; --pink:#F45FA0; --teal:#14B8C4;
  --ok:#22A866; --warn:#E89B0C; --bad:#E5484D;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --side-w:272px; --r:18px; --shadow:0 6px 0 rgba(27,42,74,.08),0 10px 24px rgba(27,42,74,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A30; --bg-dot:#15253F; --surface:#16263F; --surface-2:#1C2F4D; --ink:#EEF4FF; --muted:#9FB0CF; --line:#253A5C;
  --sky:#5AA9FF; --sun:#FFCE5C; --grass:#46CE88; --coral:#FF8378; --grape:#A487FF; --orange:#FFA95A; --pink:#FF7DB4; --teal:#3FD0DA;
  --shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A30; --bg-dot:#15253F; --surface:#16263F; --surface-2:#1C2F4D; --ink:#EEF4FF; --muted:#9FB0CF; --line:#253A5C;
  --sky:#5AA9FF; --sun:#FFCE5C; --grass:#46CE88; --coral:#FF8378; --grape:#A487FF; --orange:#FFA95A; --pink:#FF7DB4; --teal:#3FD0DA;
  --shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.2); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dot) 2px,transparent 2px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:800;background:var(--sky);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.green{background:var(--grass)}.btn.coral{background:var(--coral)}.btn.sun{background:var(--sun);color:#3a2a00}.btn.grape{background:var(--grape)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:11px}
.input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 14px}
.input:focus{border-color:var(--sky);outline:none}
label.f{display:grid;gap:6px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--sky)}
.demo-band{background:var(--sun);color:#3a2a00;text-align:center;font-weight:800;font-size:14px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:920px;min-width:0;display:grid;gap:24px}
.brand-hero{text-align:center;display:grid;gap:6px;justify-items:center}
.mascot{font-size:72px;line-height:1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.brand-hero h1{font-size:clamp(34px,6vw,54px);color:var(--sky);letter-spacing:0}
.brand-hero h1 span{color:var(--orange)}
.doors{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));max-width:640px;width:100%;margin-inline:auto}
.school{margin:4px 0 0;font-weight:800;font-size:17px;background:var(--surface);border-radius:999px;padding:4px 16px;box-shadow:var(--shadow)}
.credit{text-align:center;color:var(--muted);font-size:14px;margin:0}
.credit b{color:var(--ink);white-space:nowrap}
.door{border:0;text-align:center;border-radius:26px;padding:26px 18px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.16);display:grid;gap:8px;justify-items:center;transition:transform .15s}
.door:hover{transform:translateY(-4px)}
.door .ic{font-size:54px;line-height:1}
.door b{font-family:var(--f-display);font-size:26px}
.door small{opacity:.92;font-size:15px}
.door.st{background:linear-gradient(160deg,var(--grass),var(--teal))}
.door.ad{background:linear-gradient(160deg,var(--grape),var(--sky))}
.door.pa{background:linear-gradient(160deg,var(--orange),var(--coral))}
.login-form{max-width:440px;width:100%;margin-inline:auto;display:grid;gap:14px}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 12px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hint{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-radius:14px;padding:10px 14px;font-size:14px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}

/* ---------- Shell ---------- */
.side{position:fixed;top:0;bottom:0;right:0;width:var(--side-w);background:var(--surface);box-shadow:-4px 0 20px rgba(27,42,74,.06);display:flex;flex-direction:column;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);transition:transform .25s}
.side-brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.side-brand .logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,var(--sun),var(--orange));display:grid;place-items:center;font-size:26px;flex-shrink:0}
.side-brand b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.side-brand small{color:var(--muted);font-size:12px}
.side-user{margin:0 14px 8px;background:var(--surface-2);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--sun) 40%,var(--surface));flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.side-nav{overflow-y:auto;padding:4px 12px 16px;flex:1}
.nav-cat{font-size:12px;font-weight:800;color:var(--muted);padding:14px 8px 6px;letter-spacing:.02em}
.nav-link{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:14px;font-weight:800;text-align:start;color:var(--ink)}
.nav-link:hover{background:var(--surface-2)}
.nav-link.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}
.nav-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--c);flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.nav-link .badge{margin-inline-start:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}
.side-foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px dashed var(--line)}
.main{margin-right:var(--side-w);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-bottom:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:14px;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h2{font-size:26px;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.icon-btn{border:0;width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:22px;position:relative;flex-shrink:0}
.icon-btn .dot{position:absolute;top:-4px;left:-4px;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:800}
#menuBtn{display:none}
.scrim{display:none}
@media (max-width:900px){
  .side{transform:translateX(105%)} .side.open{transform:none}
  .main{margin-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  #menuBtn{display:block}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:40}
}
.content{display:grid;gap:18px}
.hero{border-radius:26px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--grape));display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(24px,4vw,34px)}
.hero .big{font-size:64px;line-height:1}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{display:flex;gap:12px;align-items:center}
.stat .n{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.tile{border:0;text-align:center;border-radius:22px;padding:20px 12px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:10px;justify-items:center;font-weight:800;font-size:17px;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tile .nav-ic{width:64px;height:64px;font-size:34px;border-radius:20px}
.sec-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sec-head h3{font-size:22px}
.item{display:grid;gap:10px;align-content:start}
.item .emoji{font-size:44px;line-height:1}
.item h4{margin:0;font-size:18px;font-family:var(--f-display)}
.tbl-wrap{overflow-x:auto;border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{padding:10px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:800;background:var(--surface-2)}
td.c,th.c{text-align:center}
.ck{font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-width:42px;padding:4px 10px;font-weight:800;font-family:var(--f-display);font-size:18px}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff}
.surahs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.surah{border:0;border-radius:18px;padding:14px 10px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:6px;justify-items:center;font-weight:800}
.surah b{font-family:var(--f-display);font-size:21px}
.surah.done{background:color-mix(in srgb,var(--grass) 16%,var(--surface))}
.surah.pend{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.surah.rep{background:color-mix(in srgb,var(--coral) 15%,var(--surface))}
.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;padding-top:10px}
.pod{border-radius:18px 18px 6px 6px;width:min(120px,30%);text-align:center;padding:10px 6px;color:#fff;display:grid;gap:4px;justify-items:center}
.pod .ava{background:rgba(255,255,255,.35)}
.pod.p1{background:var(--sun);color:#3a2a00;min-height:180px}.pod.p2{background:var(--sky);min-height:145px}.pod.p3{background:var(--orange);min-height:120px}
.heroes{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.hcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;text-align:center;position:relative}
.hcard .ph{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:80px;background:linear-gradient(160deg,color-mix(in srgb,var(--sun) 50%,var(--surface)),color-mix(in srgb,var(--orange) 40%,var(--surface)))}
.hcard .ph img{width:100%;height:100%;object-fit:cover}
.hcard .bd{padding:12px;display:grid;gap:4px}
.hcard .crown{position:absolute;top:8px;right:8px;font-size:26px}
.qr-card{background:#fff;color:#1B2A4A;border-radius:18px;padding:14px;display:grid;gap:8px;justify-items:center;text-align:center;border:3px dashed #C9D9EE}
.qr-card .qr{width:130px;height:130px}
.qr-card .qr img,.qr-card .qr canvas{width:130px!important;height:130px!important}
.qr-card code{font-family:ui-monospace,monospace;font-size:14px;direction:ltr;background:#EEF5FF;padding:2px 8px;border-radius:8px}
.lock{text-align:center;padding:30px}
.lock .emoji{font-size:64px}
.story{display:grid;gap:14px;justify-items:center;text-align:center}
.story .scene{font-size:96px;line-height:1.1;min-height:120px}
.story p{font-size:24px;font-family:var(--f-display);max-width:32ch;margin:0}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--sky)}
.notif-panel{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:60;padding:12px;display:grid;gap:8px}
.notif{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--surface-2);border:0;text-align:start;width:100%}
.notif.unread{background:color-mix(in srgb,var(--sky) 14%,var(--surface))}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:24px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:800;z-index:100;max-width:calc(100vw - 32px)}
.game-q{font-family:var(--f-display);font-size:30px;text-align:center}
.game-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game-opt{border:0;border-radius:20px;padding:16px;background:var(--surface-2);box-shadow:0 5px 0 var(--line);font-size:42px;display:grid;justify-items:center;gap:4px}
.game-opt span{font-size:20px;font-weight:800;font-family:var(--f-display)}
.game-opt.good{background:color-mix(in srgb,var(--grass) 30%,var(--surface))}
.game-opt.wrong{background:color-mix(in srgb,var(--coral) 30%,var(--surface))}
.progress{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--sky));border-radius:999px}
.sec-list{display:grid;gap:10px}
.sec-li{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2)}
.sec-li .k{font-size:24px}
.menu-row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);flex-wrap:wrap}
.menu-row .nm{flex:1;min-width:140px;font-weight:800}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
.emoji-pick button{border:2px solid var(--line);background:var(--surface);border-radius:10px;font-size:22px;width:44px;height:44px}
.emoji-pick button.on{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 15%,var(--surface))}
.color-pick{display:flex;gap:8px;flex-wrap:wrap}
.color-pick button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.color-pick button.on{box-shadow:0 0 0 3px var(--ink)}
.plat{font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;color:#fff}
.plat.yt{background:#E5484D}.plat.tt{background:#1B2A4A}.plat.ot{background:var(--muted)}
/* ---------- بوابة التسميع والرسائل ---------- */
.btn{transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{25%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
.door-gate{border-radius:26px;padding:22px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--sky));display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);overflow:hidden;position:relative}
.door-gate .gate{font-size:60px;line-height:1;animation:gate 2.4s ease-in-out infinite;transform-origin:right center}
@keyframes gate{0%,60%,100%{transform:perspective(300px) rotateY(0)}30%{transform:perspective(300px) rotateY(-28deg)}}
.door-gate h1{font-size:clamp(22px,4vw,30px)}
.asg{display:grid;gap:10px;align-content:start;position:relative}
.asg h4{margin:0;font-family:var(--f-display);font-size:20px}
.asg .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:20px;border-radius:14px;padding:6px 14px;border:3px solid currentColor}
.stamp.new{animation:stamp .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:rotate(-4deg);opacity:1}}
.r-ex{color:var(--ok)}.r-good{color:var(--sky)}.r-weak{color:var(--bad)}
.rec-box{display:grid;gap:16px;justify-items:center;text-align:center}
.mic{width:128px;height:128px;border-radius:50%;border:0;font-size:56px;background:var(--coral);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.18);position:relative}
.mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--coral);opacity:.5;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.35);opacity:0}}
.count{font-family:var(--f-display);font-size:110px;line-height:1;color:var(--coral);animation:pop .6s both}
.timer{font-family:var(--f-display);font-size:48px;font-variant-numeric:tabular-nums;line-height:1;display:flex;gap:10px;align-items:center;direction:ltr}
.rdot{width:16px;height:16px;border-radius:50%;background:var(--bad);animation:blink 1s steps(2) infinite}
.rdot.off{animation:none;background:var(--muted)}
@keyframes blink{50%{opacity:.15}}
.meter{width:100%;max-width:420px;height:70px;border-radius:14px;background:var(--surface-2)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctl .btn{min-width:120px;font-size:17px;padding:12px 16px}
.player{width:100%;display:grid;gap:10px;background:var(--surface-2);border-radius:18px;padding:14px}
.pl-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.pl-btn{border:0;border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--line);width:52px;height:52px;font-size:22px;display:grid;place-items:center;line-height:1;position:relative}
.pl-btn small{font-size:10px;font-weight:800;position:absolute;bottom:3px;color:var(--muted)}
.pl-btn.big{width:70px;height:70px;font-size:32px;background:var(--grass);color:#fff}
.pl-btn:active{transform:translateY(2px);box-shadow:none}
.pl-seek,.pl-vol{width:100%;accent-color:var(--grass)}
.pl-seek,.pl-vol,.pl-row.ltr{direction:ltr}
.pl-vol{max-width:180px}
.pl-time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;direction:ltr;font-size:14px;color:var(--muted)}
.pl-rate{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 9px;font-weight:800;font-size:14px;direction:ltr}
.pl-rate.on{background:var(--grass);border-color:var(--grass);color:#fff}
.rate-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rate-btn{border:3px solid transparent;border-radius:18px;padding:12px 6px;font-weight:800;font-size:17px;display:grid;gap:4px;justify-items:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .15s}
.rate-btn span{font-size:30px;line-height:1}
.rate-btn.ex{background:var(--ok)}.rate-btn.good{background:var(--sky)}.rate-btn.weak{background:var(--bad)}
.rate-btn.on{border-color:var(--ink);transform:translateY(-3px) scale(1.04)}
.subrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px;border-radius:14px;background:var(--surface-2)}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-radius:14px;padding:10px}
.thread-li{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);border:0;text-align:start;width:100%}
.thread-li.unread{background:color-mix(in srgb,var(--pink) 14%,var(--surface))}
.chat{display:grid;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.bub{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{justify-self:start;background:color-mix(in srgb,var(--sky) 18%,var(--surface));border-bottom-right-radius:6px}
.bub.them{justify-self:end;background:var(--surface-2);border-bottom-left-radius:6px}
.bub small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.privacy{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.game-full{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column}
.gf-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);padding-block:calc(6px + env(safe-area-inset-top,0px)) 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.gf-bar #gfMsg{font-weight:800;font-size:14px}
.game-full iframe{flex:1;width:100%;border:0;background:#000}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="layer"></div>

<script>
/* ======================================================
   منصة فصل الأبطال — نسخة تجريبية (تُحفظ البيانات في هذا المتصفح فقط)
   ====================================================== */
const KEY='fasl_abtal_demo_v1';
const SURAHS=['الفاتحة','الناس','الفلق','الإخلاص','المسد','النصر','الكافرون','الكوثر','الماعون','قريش','الفيل','الهمزة','العصر','التكاثر','القارعة'];
const LETTERS='ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن هـ و ي'.split(' ');
const ICONS=['🏠','🎮','📖','📝','✏️','📚','🌟','🏆','👥','⚙️','🛡️','🎨','🧮','🔤','🎵','🧪','🌍','🕌','🦁','🚀','🧩','🎁','📅','💬','🎬','🍎'];
const COLORS=['var(--sky)','var(--grass)','var(--sun)','var(--coral)','var(--grape)','var(--orange)','var(--pink)','var(--teal)'];
const AVAS=['🦁','🐯','🐼','🦊','🐨','🐸','🐵','🐻','🐰','🐧','🦉','🐬'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const token=(len=20)=>{const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';let t='';for(let i=0;i<len;i++)t+=ch[rnd(ch.length)];return t};
const pin=()=>String(1000+rnd(9000));
const fmt=t=>new Date(t).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}}

let D=null, S={session:null,view:'home',ui:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('⚠️ مساحة التخزين ممتلئة: احذف بعض الصور أو التسجيلات')}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function saveSess(){try{sessionStorage.setItem(KEY+'_s',JSON.stringify(S.session))}catch(e){}}
function loadSess(){try{return JSON.parse(sessionStorage.getItem(KEY+'_s'))}catch(e){return null}}

async function seed(){
  const names=['محمد','عبدالله','فيصل','سلطان','يوسف','خالد','عمر','ريان','سلمان','بدر'];
  const users=['mohammed','abdullah','faisal','sultan','yousef','khaled','omar','rayan','salman','badr'];
  const students=names.map((n,i)=>({id:uid(),name:n,username:users[i],pin:i===0?'1234':pin(),qr:token(),parent:'P-'+token(6).toUpperCase(),ava:AVAS[i%AVAS.length],star:i<3,created:Date.now()}));
  const salt=token(16);
  const d={
    admin:{email:'teacher@fasl.demo',salt,hash:await sha(salt+'Abtal@2026'),fails:0,lockUntil:0},
    students,
    menus:[
      {id:'home',type:'home',title:'الرئيسية',icon:'🏠',color:'var(--sky)',on:true,fixed:true},
      {id:'games',type:'games',title:'الألعاب التعليمية',icon:'🎮',color:'var(--grape)',on:true},
      {id:'quran',type:'quran',title:'تسميع القرآن',icon:'📖',color:'var(--grass)',on:true},
      {id:'sheets',type:'sheets',title:'أوراق العمل',icon:'📝',color:'var(--orange)',on:true},
      {id:'letters',type:'letters',title:'طريقة كتابة الحروف',icon:'✏️',color:'var(--coral)',on:true},
      {id:'enrich',type:'enrich',title:'إثرائي',icon:'📚',color:'var(--teal)',on:true},
      {id:'heroes',type:'heroes',title:'لوحة الأبطال',icon:'🌟',color:'var(--sun)',on:true}
    ],
    games:[
      {id:'g1',title:'صيد الحروف',icon:'🔤',desc:'اختر الصورة التي تبدأ بالحرف',kind:'letters',color:'var(--grape)'},
      {id:'g2',title:'عدّ واختر',icon:'🧮',desc:'عُدّ الأشكال واختر الرقم الصحيح',kind:'count',color:'var(--orange)'},
      {id:'g3',title:'تحليل الكلمات',icon:'🧩',desc:'لعبة من تصميم المعلم عبر Claude (رابط خارجي)',kind:'link',url:'game.html',color:'var(--teal)'}
    ],
    scores:[], recs:[], notifs:[],
    sheets:[
      {id:uid(),title:'ورقة حرف الباء',kind:'paper',url:'https://example.com/ba.pdf',note:'للطباعة والحل بالقلم'},
      {id:uid(),title:'تحدي الجمع حتى 10',kind:'online',url:'https://wordwall.net',note:'تُحل على الجهاز'},
      {id:uid(),title:'ورقة الألوان والأشكال',kind:'paper',url:'https://example.com/shapes.pdf',note:'للطباعة'}
    ],
    videos:[
      {id:uid(),letter:'ا',title:'كتابة حرف الألف',url:'https://www.youtube.com/'},
      {id:uid(),letter:'ب',title:'حرف الباء بالأشكال الأربعة',url:'https://www.youtube.com/'},
      {id:uid(),letter:'ت',title:'حرف التاء خطوة بخطوة',url:'https://www.tiktok.com/'},
      {id:uid(),letter:'ج',title:'نكتب الجيم معاً',url:'https://www.youtube.com/'}
    ],
    stories:[
      {id:uid(),title:'الأرنب الصادق',cover:'🐰',pages:[['🐰🥕','كان أرنبٌ صغيرٌ يحبُّ الجزر.'],['🐰🧺🦊','وجدَ سلةً فيها جزرٌ للثعلب.'],['🐰🤝🦊','أعادَ السلةَ إلى الثعلب.'],['🦊💛🐰','فرحَ الثعلبُ وقالَ: شكراً يا صادق!']]},
      {id:uid(),title:'نجمة تبحث عن صديق',cover:'⭐',pages:[['⭐🌙','في السماءِ نجمةٌ وحيدة.'],['⭐☁️','سألتِ الغيمةَ: هل تلعبين معي؟'],['⭐🌙✨','فجاءَ القمرُ وصارا صديقين.']]}
    ],
    heroes:[],
    custom:{}
  };
  // نماذج بيانات
  const now=Date.now();
  students.forEach((s,i)=>{
    const n=Math.max(0,6-i);
    for(let k=0;k<n;k++) d.recs.push({id:uid(),sid:s.id,surah:SURAHS[k],t:now-(k+i)*36e5*20,status:'ok'});
    if(i%3===1) d.recs.push({id:uid(),sid:s.id,surah:SURAHS[n],t:now-36e5*(i+1),status:'new'});
    d.scores.push({id:uid(),sid:s.id,gid:'g1',score:5-(i%4),max:5,t:now-36e5*i});
    if(i<6) d.scores.push({id:uid(),sid:s.id,gid:'g2',score:5-(i%3),max:5,t:now-36e5*(i+3)});
  });
  d.recs.filter(r=>r.status==='new').forEach(r=>d.notifs.push({id:uid(),t:r.t,read:false,text:`🎙️ تسجيل جديد: ${students.find(s=>s.id===r.sid).name} سمّع سورة ${r.surah}`,go:'quran'}));
  d.heroes=[{id:uid(),sid:students[0].id,reason:'بطل الأسبوع في القراءة',photo:''},{id:uid(),sid:students[1].id,reason:'أكمل تسميع 5 سور',photo:''},{id:uid(),sid:students[2].id,reason:'أفضل خط في الفصل',photo:''}];
  return d;
}

/* ---------- helpers ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const me=()=>S.session&&S.session.role==='student'?D.students.find(s=>s.id===S.session.id):null;
const isAdmin=()=>S.session&&S.session.role==='admin';
const stu=id=>D.students.find(s=>s.id===id)||{name:'—',ava:'🙂'};
const ava=s=>s.photo?`<span class="ava"><img src="${s.photo}" alt=""></span>`:`<span class="ava">${esc(s.ava||'🙂')}</span>`;
function status(sid,surah){const L=D.recs.filter(r=>r.sid===sid&&r.surah===surah).map(r=>({t:r.t,st:r.status}));(D.subs||[]).forEach(x=>{const a=(D.assign||[]).find(a=>a.id===x.aid);if(a&&a.surah===surah&&x.sid===sid)L.push({t:x.ratedAt||x.t,st:!x.rating?'new':x.rating==='weak'?'rep':'ok'})});const r=L.sort((a,b)=>b.t-a.t)[0];return r?r.st:null}
function totalScore(sid){return D.scores.filter(x=>x.sid===sid).reduce((a,b)=>a+b.score,0)}
function closeLayer(){if(typeof cleanupRec==='function')cleanupRec();$('#layer').innerHTML=''}
function modal(html,wide){$('#layer').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeLayer()"><div class="modal ${wide?'wide':''}" role="dialog">${html}</div></div>`}
function confirmBox(msg,fn){window._cf=fn;modal(`<h3>${esc(msg)}</h3><div class="row"><button class="btn coral" onclick="closeLayer();_cf()">نعم، احذف</button><button class="btn ghost" onclick="closeLayer()">إلغاء</button></div>`)}
/* نموذج عام: fields=[{k,label,type,options,value,ph}] */
function form(title,fields,onSubmit){
  window._fs=onSubmit;
  const f=fields.map(x=>{
    const id='fm_'+x.k;
    if(x.type==='select')return `<label class="f">${x.label}<select class="input" id="${id}">${x.options.map(o=>`<option value="${esc(o[0])}" ${o[0]==x.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    if(x.type==='textarea')return `<label class="f">${x.label}<textarea class="input" id="${id}" rows="${x.rows||4}" placeholder="${esc(x.ph||'')}">${esc(x.value||'')}</textarea></label>`;
    if(x.type==='file')return `<label class="f">${x.label}<input class="input" type="file" id="${id}" accept="${x.accept||''}"></label>`;
    return `<label class="f">${x.label}<input class="input" id="${id}" type="${x.type||'text'}" value="${esc(x.value||'')}" placeholder="${esc(x.ph||'')}" ${x.type==='url'?'dir="ltr"':''}></label>`;
  }).join('');
  modal(`<div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>
  <form id="fm" style="display:grid;gap:12px">${f}<div class="err" id="fm_err"></div><button class="btn green" type="submit">حفظ</button></form>`);
  $('#fm').onsubmit=async e=>{e.preventDefault();const v={};for(const x of fields){const el=$('#fm_'+x.k);v[x.k]=x.type==='file'?el.files[0]:el.value.trim()}
    const r=await window._fs(v);if(typeof r==='string'){$('#fm_err').textContent=r;return}closeLayer();render()};
}
function safeUrl(u){try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}
function platform(u){return /youtu/.test(u)?['yt','يوتيوب']:/tiktok/.test(u)?['tt','تيك توك']:['ot','رابط']}
function readImg(file,max=420){return new Promise((res,rej)=>{if(!file)return res('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function notify(text,go){D.notifs.unshift({id:uid(),t:Date.now(),read:false,text,go})}

/* ---------- Login ---------- */
function loginView(){
  const m=S.ui.door;
  let body='';
  if(!m){body=`<div class="doors">
    <button class="door st" onclick="S.ui.door='st';render()"><span class="ic">🎒</span><b>دخول الطالب</b><small>باسم المستخدم أو بالباركود</small></button>
    <button class="door ad" onclick="S.ui.door='ad';render()"><span class="ic">🧑‍🏫</span><b>دخول المعلم</b><small>للمدير فقط</small></button></div>`}
  else if(m==='st'){const t=S.ui.stTab||'pw';body=`<div class="card login-form">
    <h2>🎒 أهلاً يا بطل!</h2>
    <div class="tabs"><button class="${t==='pw'?'on':''}" onclick="S.ui.stTab='pw';render()">اسم المستخدم</button><button class="${t==='qr'?'on':''}" onclick="S.ui.stTab='qr';render()">الباركود 📷</button></div>
    ${t==='pw'?`<form id="lf" style="display:grid;gap:12px"><label class="f">اسم المستخدم<input class="input" id="lu" dir="ltr" autocomplete="username" required></label>
      <label class="f">الرقم السري<input class="input" id="lp" type="password" inputmode="numeric" dir="ltr" autocomplete="current-password" required></label>
      <div class="err" id="le"></div><button class="btn green">ادخل 🚀</button></form>
      <div class="hint">للتجربة: <b dir="ltr">mohammed</b> والرقم السري <b dir="ltr">1234</b><br>👨‍👩‍👦 ولي الأمر يدخل بحساب ابنه نفسه، ويجد «تقرير ولي الأمر» في القائمة.</div>`
    :`<p class="muted" style="margin:0">صوّر بطاقة الباركود الخاصة بك بكاميرا الجهاز.</p>
      <label class="btn green" style="text-align:center">📷 تصوير البطاقة<input type="file" accept="image/*" capture="environment" hidden onchange="scanQR(this.files[0])"></label>
      <div class="err" id="le"></div>
      <div class="hint">للتجربة على الكمبيوتر: من لوحة المعلم ← الطلاب ← (بطاقة) يوجد زر «تجربة الدخول بالباركود». في النسخة النهائية تفتح الكاميرا مباشرة وتقرأ البطاقة.</div>`}
    <button class="btn ghost" onclick="S.ui.door=null;render()">← رجوع</button></div>`}
  else if(m==='ad'){const lk=D.admin.lockUntil>Date.now();body=`<div class="card login-form">
    <h2>🧑‍🏫 دخول المعلم</h2>
    <form id="af" style="display:grid;gap:12px"><label class="f">البريد الإلكتروني<input class="input" id="ae" type="email" dir="ltr" autocomplete="username" required></label>
    <label class="f">كلمة المرور<input class="input" id="ap" type="password" dir="ltr" autocomplete="current-password" required></label>
    <div class="err" id="le">${lk?'تم إيقاف الدخول مؤقتاً بعد 5 محاولات خاطئة. حاول بعد '+Math.ceil((D.admin.lockUntil-Date.now())/60000)+' دقيقة.':''}</div><button class="btn grape" ${lk?'disabled':''}>دخول</button></form>
    <div class="hint">للتجربة: <b dir="ltr">teacher@fasl.demo</b> / <b dir="ltr">Abtal@2026</b><br>في النسخة الفعلية تضع بريدك وكلمة مرورك من «الأمان والخصوصية»، ويصلك رمز تحقق على البريد.</div>
    <button class="btn ghost" onclick="S.ui.door=null;render()">← رجوع</button></div>`}
  $('#app').innerHTML=`<div class="demo-band">نسخة تجريبية للعرض. البيانات محفوظة في هذا المتصفح فقط</div><main class="login"><div class="login-box">
    <div class="brand-hero"><div class="mascot">🦸‍♂️</div><h1>فصل <span>الأبطال</span></h1><p class="muted" style="margin:0;font-size:18px">منصة الصف الأول الابتدائي: نتعلم ونلعب ونتميز</p><p class="school">🏫 مدرسة طارق بن زياد بالدمام</p></div>${body}<p class="credit">جميع الحقوق محفوظة © ${new Date().getFullYear()} · إعداد وتصميم <b>أ. مصطفى الهتلان</b></p></div></main>`;
  const lf=$('#lf'),af=$('#af');
  if(lf)lf.onsubmit=e=>{e.preventDefault();const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value.trim();const s=D.students.find(s=>s.username===u&&s.pin===p);if(!s){$('#le').textContent='اسم المستخدم أو الرقم السري غير صحيح';return}login('student',s.id)};
  if(af)af.onsubmit=async e=>{e.preventDefault();const em=$('#ae').value.trim().toLowerCase(),h=await sha(D.admin.salt+$('#ap').value);
    if(em===D.admin.email&&h===D.admin.hash){D.admin.fails=0;save();login('admin','admin')}
    else{D.admin.fails++;if(D.admin.fails>=5){D.admin.lockUntil=Date.now()+5*60000;D.admin.fails=0}save();$('#le').textContent=D.admin.lockUntil>Date.now()?'تم إيقاف الدخول 5 دقائق لحماية الحساب.':`البيانات غير صحيحة (المحاولات المتبقية: ${5-D.admin.fails})`;if(D.admin.lockUntil>Date.now())render()}};
}
function scanQR(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  const r=window.jsQR?jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height):null;qrLogin(r&&r.data)};im.src=fr.result};fr.readAsDataURL(file)}

function addGame(){form('إضافة لعبة جديدة',[{k:'title',label:'اسم اللعبة'},{k:'icon',label:'أيقونة (رمز تعبيري)',value:'🎮'},{k:'desc',label:'وصف قصير'},{k:'file',label:'📁 ملف اللعبة (HTML) — الطريقة المستحسنة',type:'file',accept:'.html,.htm,text/html'},{k:'url',label:'أو رابط اللعبة (لا تُسجَّل نتائجه)',type:'url',ph:'https://...'}],async v=>{

  const f=$('#gfFrame');GF={frame:f,gid:id,last:0};
  const sk=(me()?me().id:'teacher')+':'+id;D.gstore=D.gstore||{};const init=JSON.stringify(D.gstore[sk]||{}).replace(/</g,'\\u003c');
  const shim=`<script>(function(){var d=${init},t=0;function sync(){clearTimeout(t);t=setTimeout(function(){try{parent.postMessage({type:'fasl-storage',data:d},'*')}catch(e){}},300)}
var st={getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[String(k)]=String(v);sync()},removeItem:function(k){delete d[String(k)];sync()},clear:function(){d={};sync()},key:function(i){return Object.keys(d)[i]||null}};
Object.defineProperty(st,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:st,configurable:true})}catch(e){}})();<\/script>`;
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+shim):shim+html;

window.addEventListener('message',e=>{

  const sc=Math.round(+d.score),mx=Math.round(+d.max);if(!isFinite(sc)||!isFinite(mx)||mx<1||mx>1000||sc<0||sc>mx)return;
  if(Date.now()-GF.last<1500)return;GF.last=Date.now();
  const g=D.games.find(x=>x.id===GF.gid);const s=me();const m=$('#gfMsg');

  if(m){m.textContent=`🌟 سُجّلت نتيجتك: ${sc} من ${mx}`;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}sfx('good')});

const WORDS=[['ب','بطة','🦆'],['ت','تفاحة','🍎'],['س','سمكة','🐟'],['ق','قطة','🐱'],['ش','شمس','☀️'],['ف','فيل','🐘'],['ج','جمل','🐫'],['م','موز','🍌'],['ن','نحلة','🐝'],['ك','كرة','⚽'],['ز','زرافة','🦒'],['ح','حصان','🐴']];
let G=null;
function playGame(id){const g=D.games.find(x=>x.id===id);G={g,round:0,score:0,max:5};nextRound()}
function nextRound(){
  if(G.round>=G.max)return endGame();
  let q,opts,ans;
  if(G.g.kind==='letters'){const pool=[...WORDS].sort(()=>Math.random()-.5).slice(0,4);ans=rnd(4);q=`أي صورة تبدأ بحرف <b style="color:var(--grape);font-size:44px">${pool[ans][0]}</b> ؟`;opts=pool.map(w=>`${w[2]}<span>${w[1]}</span>`)}
  else{const n=1+rnd(9),e=['🍎','⭐','🐟','🎈','🌸'][rnd(5)];q=`<div style="font-size:38px;line-height:1.4">${e.repeat(n)}</div>كم عددها؟`;const set=new Set([n]);while(set.size<4)set.add(1+rnd(10));opts=[...set].sort(()=>Math.random()-.5);ans=opts.indexOf(n);opts=opts.map(x=>`<span style="font-size:40px">${x}</span>`)}
  G.ans=ans;G.lock=false;
  modal(`<div class="modal-h"><h3>${esc(G.g.icon)} ${esc(G.g.title)}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>
  <div class="progress"><i style="width:${G.round/G.max*100}%"></i></div><div class="row" style="justify-content:space-between"><small class="muted">سؤال ${G.round+1} من ${G.max}</small><b>⭐ ${G.score}</b></div>
  <div class="game-q">${q}</div><div class="game-opts">${opts.map((o,i)=>`<button class="game-opt" onclick="pick(${i},this)">${o}</button>`).join('')}</div>`);
}
function pick(i,el){if(G.lock)return;G.lock=true;const bs=document.querySelectorAll('.game-opt');bs[G.ans].classList.add('good');if(i===G.ans){G.score++}else el.classList.add('wrong');G.round++;setTimeout(nextRound,800)}
function endGame(){const s=me();if(s){D.scores.push({id:uid(),sid:s.id,gid:G.g.id,score:G.score,max:G.max,t:Date.now()});notify(`🎮 ${s.name} أنهى لعبة «${G.g.title}» بنتيجة ${G.score}/${G.max}`,'results');save()}
  modal(`<div class="story"><div class="scene">${G.score>=4?'🏆🎉':G.score>=2?'⭐👏':'💪🙂'}</div><h2>${G.score>=4?'رائع يا بطل!':G.score>=2?'أحسنت!':'حاول مرة أخرى'}</h2><p>نتيجتك ${G.score} من ${G.max}</p>${s?'':'<small class="muted">(وضع المعلم: لا تُحفظ النتيجة)</small>'}
  <div class="row"><button class="btn green" onclick="playGame('${G.g.id}')">العب مرة أخرى</button><button class="btn ghost" onclick="closeLayer();render()">إغلاق</button></div></div>`)}

function addStory(){form('إضافة قصة مصوّرة',[{k:'title',label:'عنوان القصة'},{k:'cover',label:'رمز الغلاف',value:'📕'},{k:'img',label:'صورة الغلاف (اختياري)',type:'file',accept:'image/*'},{k:'pages',label:'الصفحات: كل سطر صفحة، بصيغة: الرسمة | النص',type:'textarea',rows:6,ph:'🐢🌳 | خرجت السلحفاة إلى الغابة\n🐢🐇 | قابلت الأرنب'}],async v=>{const pages=v.pages.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[1]);if(!v.title||!pages.length)return 'أضف العنوان وصفحة واحدة على الأقل';D.stories.unshift({id:uid(),title:v.title,cover:v.cover||'📕',img:await readImg(v.img,500),pages});save();toast('أُضيفت القصة')})}

/* Students (admin) */
function vStudents(){
  const tab=S.ui.st||'list';
  const tabs=`<div class="tabs" style="max-width:640px">${[['list','📋 قائمة الطلاب'],['add','➕ إضافة طلاب'],['cards','🪪 بطاقات الدخول']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="S.ui.st='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
  if(tab==='list')return tabs+`<div class="card tbl-wrap"><table><thead><tr><th>الطالب</th><th>اسم المستخدم</th><th>الرقم السري</th><th class="c">متميز</th><th class="c">النقاط</th><th>إجراءات</th></tr></thead><tbody>
    ${D.students.map(s=>`<tr><td><div class="row">${ava(s)}<b>${esc(s.name)}</b></div></td><td dir="ltr">${esc(s.username)}</td><td dir="ltr">${S.ui.show===s.id?esc(s.pin):'••••'} <button class="btn sm ghost" onclick="S.ui.show=S.ui.show==='${s.id}'?null:'${s.id}';render()" aria-label="إظهار">👁️</button></td>
    <td class="c"><button class="btn sm ${s.star?'sun':'ghost'}" onclick="stu('${s.id}').star=!stu('${s.id}').star;save();render()">${s.star?'⭐ نعم':'لا'}</button></td><td class="c">${totalScore(s.id)}</td>
    <td><div class="row"><button class="btn sm" onclick="showCard('${s.id}')">🪪 البطاقة</button><button class="btn sm ghost" onclick="resetPin('${s.id}')">🔄 رقم جديد</button><button class="btn sm ghost" onclick="confirmBox('حذف الطالب وكل بياناته؟',()=>delStudent('${s.id}'))">🗑️</button></div></td></tr>`).join('')}</tbody></table></div>`;
  if(tab==='add'){const m=S.ui.am||'one';return tabs+`<div class="card" style="display:grid;gap:14px;max-width:680px">
    <div class="tabs">${[['one','طالب واحد'],['list','قائمة أسماء'],['csv','ملف CSV / Excel']].map(t=>`<button class="${m===t[0]?'on':''}" onclick="S.ui.am='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
    ${m==='one'?`<label class="f">اسم الطالب<input class="input" id="n1" placeholder="مثال: نواف"></label><label class="f">اسم المستخدم (اختياري، يُولَّد تلقائياً)<input class="input" id="u1" dir="ltr" placeholder="nawaf"></label><button class="btn green" onclick="addOne()">إضافة وتوليد الباركود</button>`
    :m==='list'?`<label class="f">الصق أسماء الطلاب (اسم في كل سطر)<textarea class="input" id="nl" rows="7" placeholder="نواف\nتركي\nمشعل"></textarea></label><button class="btn green" onclick="addList()">إضافة الجميع</button>`
    :`<p class="muted" style="margin:0">ارفع ملف CSV فيه عمود للاسم، ويمكن إضافة عمود ثانٍ لاسم المستخدم. (احفظ ملف Excel بصيغة CSV)</p><input class="input" type="file" id="cf" accept=".csv,text/csv"><button class="btn green" onclick="addCSV()">استيراد</button>`}
    <div class="hint">كل طالب جديد يحصل تلقائياً على: اسم مستخدم، رقم سري من 4 أرقام، وباركود دخول خاص. وولي الأمر يتابع من حساب ابنه.</div></div>`}
  afterRender.push(()=>D.students.forEach(s=>drawQR('qr_'+s.id,s)));
  return tabs+`<div class="hint">في النسخة الفعلية: زر «طباعة البطاقات» يطبعها على ورق A4 لقصها وتوزيعها.</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${D.students.map(cardHTML).join('')}</div>`;
}
function cardHTML(s){return `<div class="qr-card"><b style="font-family:var(--f-display);font-size:20px">${esc(s.ava)} ${esc(s.name)}</b><div class="qr" id="qr_${s.id}"></div><div>المستخدم: <code>${esc(s.username)}</code></div><div>الرقم السري: <code>${esc(s.pin)}</code></div></div>`}
function drawQR(id,s){const el=document.getElementById(id);if(!el)return;if(!window.QRCode){el.innerHTML='<small style="display:grid;place-items:center;height:100%;text-align:center">تعذّر رسم الباركود، تحقق من الاتصال بالإنترنت ثم أعد فتح الصفحة</small>';return}el.innerHTML='';new QRCode(el,{text:'FASL1:'+s.qr,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}
function showCard(id){const s=stu(id);modal(`<div class="modal-h"><h3>بطاقة دخول الطالب</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>${cardHTML(s).replace('id="qr_','id="mqr_')}
  <div class="row"><button class="btn green" onclick="closeLayer();S.session=null;qrLogin('FASL1:${s.qr}')">📷 تجربة الدخول بالباركود</button><button class="btn ghost" onclick="newQR('${s.id}')">🔄 باركود جديد (يلغي القديم)</button></div>`);drawQR('mqr_'+s.id,s)}
function newQR(id){stu(id).qr=token();save();toast('تم توليد باركود جديد، البطاقة القديمة لم تعد تعمل');showCard(id)}
function resetPin(id){stu(id).pin=pin();save();S.ui.show=id;render();toast('تم توليد رقم سري جديد')}
function delStudent(id){D.students=D.students.filter(s=>s.id!==id);D.recs=D.recs.filter(r=>r.sid!==id);D.scores=D.scores.filter(r=>r.sid!==id);D.heroes=D.heroes.filter(r=>r.sid!==id);D.subs.filter(x=>x.sid===id).forEach(x=>IDB.del(x.id));D.subs=D.subs.filter(x=>x.sid!==id);D.threads=D.threads.filter(t=>t.sid!==id);save();render();toast('تم الحذف')}
const TR={'ا':'a','أ':'a','إ':'e','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'w','ي':'y','ى':'a','ء':'','ئ':'e','ؤ':'o'};
function mkUser(name,want){let u=(want||[...name].map(c=>TR[c]??(/[a-z0-9]/i.test(c)?c:'')).join('')).toLowerCase().replace(/[^a-z0-9]/g,'')||'student';let b=u,i=2;while(D.students.some(s=>s.username===u))u=b+i++;return u}
function newStudent(name,u){const s={id:uid(),name,username:mkUser(name,u),pin:pin(),qr:token(),parent:'P-'+token(6).toUpperCase(),ava:AVAS[rnd(AVAS.length)],star:false,created:Date.now()};D.students.push(s);return s}
function addOne(){const n=$('#n1').value.trim();if(!n)return toast('اكتب اسم الطالب');newStudent(n,$('#u1').value.trim());save();S.ui.st='cards';render();toast('أُضيف الطالب ✅')}
function addList(){const ns=$('#nl').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ns.length)return toast('الصق الأسماء أولاً');ns.forEach(n=>newStudent(n));save();S.ui.st='cards';render();toast(`أُضيف ${ns.length} طالب ✅`)}
function addCSV(){const f=$('#cf').files[0];if(!f)return toast('اختر الملف');const fr=new FileReader();fr.onload=()=>{const rows=fr.result.replace(/^﻿/,'').split(/\r?\n/).map(l=>l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r[0]&&!/^(name|الاسم|اسم)$/i.test(r[0]));rows.forEach(r=>newStudent(r[0],r[1]));save();S.ui.st='cards';render();toast(`استُورد ${rows.length} طالب ✅`)};fr.readAsText(f,'utf-8')}

/* ---------- المؤثرات الصوتية (تُولَّد داخل المتصفح بدون ملفات) ---------- */
let AC=null;
let muted=(()=>{try{return localStorage.getItem(KEY+'_mute')==='1'}catch(e){return false}})();
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type,v,when,slideTo){const a=ac();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const SFX={
  tap:()=>tone(700,.07,'triangle',.08),
  open:()=>{tone(523,.1,'triangle',.12);tone(784,.16,'triangle',.11,.08)},
  beep:()=>tone(660,.12,'sine',.16),
  go:()=>tone(1046,.25,'sine',.18),
  pause:()=>tone(440,.12,'square',.05),
  resume:()=>tone(587,.12,'square',.05),
  stop:()=>{tone(660,.1,'triangle',.12);tone(440,.18,'triangle',.11,.09)},
  send:()=>tone(380,.4,'sine',.14,0,1300),
  del:()=>tone(520,.32,'sawtooth',.05,0,110),
  ex:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.08)),
  good:()=>[523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.1)),
  weak:()=>{tone(392,.22,'sine',.12);tone(349,.32,'sine',.1,.2)},
  msg:()=>{tone(988,.08,'sine',.12);tone(1319,.14,'sine',.1,.07)}
};
function sfx(n){if(muted)return;try{SFX[n]&&SFX[n]()}catch(e){}}
function toggleMute(){muted=!muted;try{localStorage.setItem(KEY+'_mute',muted?'1':'0')}catch(e){}if(!muted)sfx('open');render()}
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button,label.btn,a.btn');if(b&&!b.hasAttribute('data-sfx'))sfx('tap')},{passive:true});
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n){if(reduced())return;const box=document.createElement('div');box.className='confetti';const cs=['var(--sun)','var(--coral)','var(--sky)','var(--grass)','var(--grape)','var(--pink)'];for(let i=0;i<(n||70);i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cs[i%cs.length];p.style.animationDelay=Math.random()*.4+'s';p.style.animationDuration=(1.6+Math.random()*1.3)+'s';p.style.setProperty('--x',(Math.random()*160-80)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');box.appendChild(p)}document.body.appendChild(box);setTimeout(()=>box.remove(),3400)}
const mmss=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const kb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

/* ---------- تخزين الملفات الصوتية (IndexedDB) ---------- */
const IDB={p:null,
  open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open(KEY+'_audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
  async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction('a').objectStore('a').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async del(k){try{const d=await this.open();await new Promise(res=>{const t=d.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=res;t.onerror=res;t.onabort=res})}catch(e){}}
};
const blobToDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
/* صوت نموذجي للتسليمات التجريبية فقط */
function demoWav(seed){const sr=8000,sec=6,n=sr*sec,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const notes=[392,440,494,440,392,349,392,440].map(f=>f*(1+(seed%3)*.06));for(let i=0;i<n;i++){const k=Math.floor(i/(n/notes.length)),ph=(i%(n/notes.length))/(n/notes.length);const env=Math.sin(Math.PI*ph)*.35;v.setInt16(44+i*2,Math.sin(2*Math.PI*notes[k]*i/sr)*env*32767,true)}
  return new Blob([buf],{type:'audio/wav'})}
let objURLs=[];
async function srcFor(sub){try{if(sub.inline)return sub.inline;if(sub.demo){const u=URL.createObjectURL(demoWav(sub.t%7));objURLs.push(u);return u}const b=await IDB.get(sub.id);if(!b)return null;const u=URL.createObjectURL(b);objURLs.push(u);return u}catch(e){return null}}

/* ---------- مشغّل الصوت الكامل ---------- */
const RATES=[0.5,0.75,1,1.25,1.5,2];
function playerHTML(pid){return `<div class="player" id="${pid}"><audio preload="metadata"></audio>
  <div class="pl-row ltr"><button class="pl-btn" data-a="restart" aria-label="من البداية">⏮️</button><button class="pl-btn" data-a="back" aria-label="إرجاع 5 ثوانٍ">⏪<small>5ث</small></button><button class="pl-btn big" data-a="play" aria-label="تشغيل">▶️</button><button class="pl-btn" data-a="fwd" aria-label="تقديم 5 ثوانٍ">⏩<small>5ث</small></button><button class="pl-btn" data-a="loop" aria-label="تكرار">🔁</button></div>
  <input type="range" class="pl-seek" min="0" max="1000" value="0" aria-label="موضع التشغيل"><div class="pl-time"><span class="cur">0:00</span><span class="tot">0:00</span></div>
  <div class="pl-row"><span class="muted" style="font-weight:800">السرعة</span>${RATES.map(r=>`<button class="pl-rate ${r===1?'on':''}" data-r="${r}">${r}×</button>`).join('')}</div>
  <div class="pl-row"><button class="pl-btn" data-a="mute" aria-label="كتم الصوت" style="width:40px;height:40px;font-size:18px">🔊</button><input type="range" class="pl-vol" min="0" max="1" step="0.05" value="1" aria-label="مستوى الصوت"></div></div>`}
function bindPlayer(pid,src,hint){
  const el=document.getElementById(pid);if(!el)return;const a=el.querySelector('audio'),seek=el.querySelector('.pl-seek'),cur=el.querySelector('.cur'),tot=el.querySelector('.tot'),pb=el.querySelector('[data-a="play"]');
  if(!src){el.innerHTML='<p class="muted" style="margin:0">⚠️ الملف الصوتي غير موجود على هذا الجهاز.</p>';return}
  let fixing=false,drag=false;
  const dur=()=>isFinite(a.duration)&&a.duration>0?a.duration:(hint||0);
  const upd=()=>{const d=dur();cur.textContent=mmss(a.currentTime);tot.textContent=mmss(d);if(!drag)seek.value=d?Math.round(a.currentTime/d*1000):0};
  a.addEventListener('loadedmetadata',()=>{if(!isFinite(a.duration)){fixing=true;try{a.currentTime=1e7}catch(e){fixing=false}}upd()});
  a.addEventListener('timeupdate',()=>{if(fixing){fixing=false;a.currentTime=0}upd()});
  a.addEventListener('durationchange',upd);
  a.addEventListener('play',()=>{pb.textContent='⏸️';pb.setAttribute('aria-label','إيقاف مؤقت')});
  a.addEventListener('pause',()=>{pb.textContent='▶️';pb.setAttribute('aria-label','تشغيل')});
  a.addEventListener('ended',()=>{pb.textContent='▶️';upd()});
  a.addEventListener('error',()=>{tot.textContent='تعذّر التشغيل'});
  seek.addEventListener('input',()=>{drag=true;const d=dur();cur.textContent=mmss(seek.value/1000*d)});
  seek.addEventListener('change',()=>{const d=dur();if(d)a.currentTime=seek.value/1000*d;drag=false});
  el.querySelector('.pl-vol').addEventListener('input',e=>{a.volume=+e.target.value;a.muted=false;el.querySelector('[data-a="mute"]').textContent=a.volume?'🔊':'🔇'});
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const act=b.dataset.a;
    if(b.dataset.r){a.playbackRate=+b.dataset.r;try{a.preservesPitch=true}catch(_){}el.querySelectorAll('.pl-rate').forEach(x=>x.classList.toggle('on',x===b));return}
    if(act==='play'){if(a.paused){a.play().catch(()=>toast('اضغط تشغيل مرة أخرى'))}else a.pause()}
    else if(act==='back')a.currentTime=Math.max(0,a.currentTime-5);
    else if(act==='fwd'){const d=dur();a.currentTime=d?Math.min(d,a.currentTime+5):a.currentTime+5}
    else if(act==='restart'){a.currentTime=0;a.play().catch(()=>{})}
    else if(act==='loop'){a.loop=!a.loop;b.style.background=a.loop?'var(--sun)':''}
    else if(act==='mute'){a.muted=!a.muted;b.textContent=a.muted?'🔇':'🔊'}
    upd()});
  a.src=src;upd();
}

/* ---------- المسجّل ---------- */
const REC={st:'idle',mr:null,stream:null,chunks:[],t0:0,acc:0,raf:0,an:null,src:null,blob:null,mime:'',dur:0,err:'',aid:null,cd:null,tick:null,confirm:false,discard:false};
function pickMime(){if(!window.MediaRecorder)return null;for(const m of ['audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/mp4;codecs=opus']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return null}
const fmtName=m=>/opus/i.test(m||'')?'Opus':((m||'').split(';')[0].split('/')[1]||'صوت').toUpperCase();
function elapsed(){return (REC.acc+(REC.st==='rec'?performance.now()-REC.t0:0))/1000}
function stopStream(){cancelAnimationFrame(REC.raf);clearInterval(REC.tick);if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null}if(REC.src){try{REC.src.disconnect()}catch(e){}REC.src=null}REC.an=null}
function cleanupRec(){clearInterval(REC.cd);if(REC.mr){REC.mr._discard=true;if(REC.mr.state!=='inactive'){try{REC.mr.stop()}catch(e){}}}stopStream();REC.mr=null;REC.st='idle';REC.blob=null;REC.err='';REC.confirm=false;stopPlayers();objURLs.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});objURLs=[]}
async function startRec(){
  if(REC.st!=='idle')return;REC.err='';const mime=pickMime();
  if(mime===null||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){REC.err='unsupported';return drawRec()}
  REC.st='asking';drawRec();let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){REC.st='idle';REC.err=(e&&e.name==='NotFoundError')?'nomic':'denied';return drawRec()}
  if(REC.st!=='asking'||!document.getElementById('recArea')){st.getTracks().forEach(t=>t.stop());return}
  REC.stream=st;
  REC.st='count';let n=3;drawRec(n);sfx('beep');
  REC.cd=setInterval(()=>{n--;if(n>0){drawRec(n);sfx('beep')}else{clearInterval(REC.cd);sfx('go');setTimeout(beginRec,180)}},800);
}
function beginRec(){
  if(REC.st!=='count'||!REC.stream)return;

  let mr;if(!mime){REC.err='unsupported';stopStream();REC.st='idle';return drawRec()}try{mr=new MediaRecorder(REC.stream,opts)}catch(e){REC.err='unsupported';stopStream();REC.st='idle';return drawRec()}
  REC.mr=mr;const chunks=[];REC.mime=mr.mimeType||mime||'audio/webm';const mtype=REC.mime;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{if(mr._discard||REC.mr!==mr)return;stopStream();const b=new Blob(chunks,{type:mtype});if(!b.size){REC.err='empty';REC.st='idle';REC.mr=null;return drawRec()}REC.blob=b;REC.st='done';REC.mr=null;drawRec()};
  mr.onerror=()=>{if(REC.mr!==mr)return;REC.err='failed';cleanupRec();drawRec()};
  try{mr.start(1000)}catch(e){REC.err='failed';cleanupRec();return drawRec()}REC.st='rec';REC.t0=performance.now();REC.acc=0;
  try{const a=ac();if(a){REC.src=a.createMediaStreamSource(REC.stream);REC.an=a.createAnalyser();REC.an.fftSize=256;REC.src.connect(REC.an)}}catch(e){REC.an=null}
  drawRec();REC.tick=setInterval(()=>{const t=document.getElementById('rtime');if(t)t.textContent=mmss(elapsed());if(REC.st==='rec'&&elapsed()>=600){toast('وصلت للحد الأقصى (10 دقائق)');stopRec()}},250);
}
function pauseRec(){if(REC.st!=='rec'||!REC.mr)return;try{REC.mr.pause()}catch(e){return}REC.acc+=performance.now()-REC.t0;REC.st='paused';sfx('pause');drawRec()}
function resumeRec(){if(REC.st!=='paused'||!REC.mr)return;try{REC.mr.resume()}catch(e){return}REC.t0=performance.now();REC.st='rec';sfx('resume');drawRec()}
function stopRec(){if(!REC.mr||(REC.st!=='rec'&&REC.st!=='paused'))return;if(REC.st==='rec')REC.acc+=performance.now()-REC.t0;REC.dur=REC.acc/1000;REC.st='saving';sfx('stop');drawRec();try{REC.mr.stop()}catch(e){REC.err='failed';cleanupRec();drawRec()}}

function meter(){cancelAnimationFrame(REC.raf);const c=document.getElementById('meter');if(!c||!REC.an||REC.st!=='rec')return;const g=c.getContext('2d'),W=c.width=c.clientWidth*2,H=c.height=c.clientHeight*2;const data=new Uint8Array(REC.an.frequencyBinCount);const col=getComputedStyle(document.documentElement).getPropertyValue('--grass').trim()||'#2FB872';
  const loop=()=>{if(REC.st!=='rec'||!REC.an||!c.isConnected)return;REC.an.getByteFrequencyData(data);g.clearRect(0,0,W,H);const n=32,bw=W/n;g.fillStyle=col;for(let i=0;i<n;i++){const v=data[Math.floor(i*data.length/n/1.5)]/255;const h=Math.max(6,v*H*.95);g.beginPath();if(g.roundRect)g.roundRect(i*bw+3,(H-h)/2,bw-6,h,6);else g.rect(i*bw+3,(H-h)/2,bw-6,h);g.fill()}REC.raf=requestAnimationFrame(loop)};loop()}

  if(REC.st==='rec'||REC.st==='paused'){const r=REC.st==='rec';
    box.innerHTML=`<div class="timer"><span class="rdot ${r?'':'off'}"></span><span id="rtime">${mmss(elapsed())}</span></div><b>${r?'🔴 جارٍ التسجيل...':'⏸️ متوقف مؤقتاً'}</b><canvas id="meter" class="meter"></canvas>
    <div class="ctl">${r?`<button class="btn sun" data-sfx onclick="pauseRec()">⏸️ إيقاف مؤقت</button>`:`<button class="btn" data-sfx onclick="resumeRec()">▶️ استئناف</button>`}<button class="btn green" data-sfx onclick="stopRec()">⏹️ إنهاء التسجيل</button><button class="btn ghost" data-sfx onclick="cancelRec()">✖️ إلغاء</button></div>`;
    if(r)meter();return}
  if(REC.st==='saving'){box.innerHTML='<b>⏳ لحظة...</b>';return}
  if(REC.st==='done'){const u=URL.createObjectURL(REC.blob);objURLs.push(u);
    box.innerHTML=`<b style="font-size:20px">🎉 انتهى التسجيل! استمع له قبل الإرسال</b><small class="muted">${REC.dur?'⏱️ '+mmss(REC.dur)+' · ':''}الصيغة: ${fmtName(REC.mime)} · ${kb(REC.blob.size)}</small>${playerHTML('prv')}
    <div class="ctl"><button class="btn green" data-sfx onclick="sendSub()">📤 إرسال للمعلم</button><button class="btn ghost" data-sfx onclick="sfx('del');cleanupRec();drawRec()">🔁 إعادة التسجيل</button><button class="btn ghost" data-sfx onclick="sfx('del');cleanupRec();drawRec()" aria-label="حذف التسجيل">🗑️ حذف</button></div>`;
    bindPlayer('prv',u,REC.dur);return}
  if(REC.st==='sending'){box.innerHTML='<b>📤 جارٍ الإرسال...</b>'}
}
async function sendSub(){
  const s=me(),a=asg(REC.aid);if(!s||!a||!REC.blob||REC.st!=='done')return;
  if(!a.open){toast('أغلق المعلم الباب لهذا الواجب');return}
  REC.st='sending';drawRec();stopPlayers();
  const id=uid();let inline='';
  try{await IDB.put(id,REC.blob)}catch(e){if(REC.blob.size>1.5e6){REC.st='done';drawRec();toast('تعذّر حفظ التسجيل، جرّب تسجيلاً أقصر');return}try{inline=await blobToDataURL(REC.blob)}catch(e2){REC.st='done';drawRec();toast('تعذّر حفظ التسجيل');return}}
  const old=subOf(a.id,s.id);if(old){await IDB.del(old.id);D.subs=D.subs.filter(x=>x!==old)}
  D.subs.push({id,aid:a.id,sid:s.id,t:Date.now(),dur:REC.dur,mime:REC.mime,size:REC.blob.size,inline,rating:null,seen:true});
  notify(`🎙️ تسجيل جديد: ${s.name} سمّع «${a.title}»`,'quran');save();
  REC.blob=null;REC.st='idle';objURLs.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});objURLs=[];
  sfx('send');setTimeout(()=>{sfx('ex');confetti(70)},350);toast('📤 وصل تسجيلك للمعلم!');render();drawRec()}
async function mySubDel(id){await IDB.del(id);D.subs=D.subs.filter(x=>x.id!==id);save();REC.confirm=false;sfx('del');toast('🗑️ حُذف تسجيلك');render();drawRec()}

/* ---------- صندوق الاقتراحات والرسائل ---------- */
function vSuggest(){
  const s=me();const tid=S.ui.th;
  const list=(isAdmin()?D.threads:D.threads.filter(t=>t.sid===s.id)).slice().sort((a,b)=>lastT(b)-lastT(a));
  if(tid){const t=D.threads.find(x=>x.id===tid&&(isAdmin()||x.sid===s.id));if(t)return threadView(t)}
  const unreadOf=t=>isAdmin()?!t.readT:!t.readS;
  return `<div class="door-gate pop" style="background:linear-gradient(135deg,var(--pink),var(--grape))"><span class="gate" style="animation:none">💌</span><div style="flex:1;min-width:200px"><h1>${isAdmin()?'رسائل الطلاب وأولياء الأمور':'اكتب للمعلم'}</h1><p style="margin:4px 0 0;opacity:.95">${isAdmin()?'كل رسالة خاصة بين المعلم ومُرسلها فقط.':'اقتراح أو سؤال؟ اكتبه هنا، ولا يراه إلا المعلم.'}</p></div>${isAdmin()?'':`<button class="btn sun" data-sfx onclick="sfx('open');newThread()">✍️ رسالة جديدة</button>`}</div>
  <div class="privacy">🔒 ${isAdmin()?'الطالب لا يرى رسائل غيره، وأنت فقط من يرى كل الرسائل.':'رسائلك سرّية: لا يراها أحد غيرك وغير المعلم.'}</div>
  <div class="sec-list">${list.map(t=>{const st=stu(t.sid);const last=t.msgs[t.msgs.length-1];return `<button class="thread-li ${unreadOf(t)?'unread':''} pop" data-sfx onclick="sfx('open');openThread('${t.id}')">${ava(st)}<div style="flex:1;min-width:0"><b>${esc(t.subject)}</b> ${unreadOf(t)?'<span class="pill bad">جديد</span>':''}<br><small class="muted">${isAdmin()?esc(st.name)+' · '+(t.from==='parent'?'👨‍👩‍👦 ولي الأمر':'🎒 الطالب')+' · ':''}${esc((last.by==='t'?'المعلم: ':'')+last.text.slice(0,60))}</small></div><small class="muted">${fmt(lastT(t))}</small></button>`}).join('')||`<div class="card lock"><div class="emoji">📭</div><p class="muted">${isAdmin()?'لا توجد رسائل بعد.':'لم ترسل أي رسالة بعد.'}</p></div>`}</div>`}
const lastT=t=>t.msgs.length?t.msgs[t.msgs.length-1].t:t.t;
function openThread(id){const t=D.threads.find(x=>x.id===id);if(!t)return;if(isAdmin())t.readT=true;else t.readS=true;save();S.ui.th=id;render();const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight}
function threadView(t){const st=stu(t.sid);const mine=m=>isAdmin()?m.by==='t':m.by==='s';
  return `<div class="row"><button class="btn ghost sm" onclick="S.ui.th=null;render()">→ كل الرسائل</button>${isAdmin()?`<button class="btn ghost sm" onclick="confirmBox('حذف المحادثة؟',()=>{D.threads=D.threads.filter(x=>x.id!=='${t.id}');S.ui.th=null;save();sfx('del');render()})">🗑️ حذف المحادثة</button>`:''}</div>
  <div class="card" style="display:grid;gap:12px"><div class="row">${ava(st)}<div><b>${esc(t.subject)}</b><br><small class="muted">${esc(st.name)} · ${t.from==='parent'?'👨‍👩‍👦 من ولي الأمر':'🎒 من الطالب'}</small></div></div>
  <div class="chat">${t.msgs.map(m=>`<div class="bub ${mine(m)?'me':'them'} pop">${esc(m.text)}<small>${m.by==='t'?'🧑‍🏫 المعلم':(t.from==='parent'?'👨‍👩‍👦 ولي الأمر':'🎒 '+esc(st.name))} · ${fmt(m.t)}</small></div>`).join('')}</div>
  <form id="rf" class="row" style="align-items:flex-end"><label class="f" style="flex:1;min-width:200px">${isAdmin()?'ردّك':'رسالة'}<textarea class="input" id="rt" rows="2" maxlength="1000" required></textarea></label><button class="btn" data-sfx style="background:var(--pink)">إرسال 📨</button></form>
  <div class="privacy">🔒 لا يرى هذه المحادثة إلا المعلم و${esc(st.name)}.</div></div>`}
function newThread(){form('✍️ رسالة جديدة للمعلم',[{k:'from',label:'من يكتب؟',type:'select',options:[['student','🎒 أنا الطالب'],['parent','👨‍👩‍👦 ولي الأمر']]},{k:'subject',label:'الموضوع',ph:'اقتراح، سؤال، ملاحظة...'},{k:'text',label:'الرسالة',type:'textarea',rows:5}],v=>{
  if(!v.subject||!v.text)return 'اكتب الموضوع والرسالة';if(v.text.length>1000)return 'الرسالة طويلة (الحد 1000 حرف)';const s=me();const now=Date.now();
  D.threads.push({id:uid(),sid:s.id,from:v.from==='parent'?'parent':'student',subject:v.subject.slice(0,80),t:now,readT:false,readS:true,msgs:[{by:'s',text:v.text,t:now}]});
  notify(`💌 رسالة جديدة من ${v.from==='parent'?'ولي أمر ':''}${s.name}: ${v.subject.slice(0,40)}`,'suggest');save();sfx('send');toast('📨 وصلت رسالتك للمعلم')})}
document.addEventListener('submit',e=>{if(e.target.id!=='rf')return;e.preventDefault();const t=D.threads.find(x=>x.id===S.ui.th);const txt=$('#rt').value.trim();if(!t||!txt)return;if(!isAdmin()&&(!me()||t.sid!==me().id))return;
  const by=isAdmin()?'t':'s';t.msgs.push({by,text:txt.slice(0,1000),t:Date.now()});if(by==='t'){t.readS=false;t.readT=true}else{t.readT=false;t.readS=true;notify(`💌 ردّ جديد من ${stu(t.sid).name}: ${t.subject.slice(0,40)}`,'suggest')}
  save();sfx('msg');render();const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight});

/* ---------- Render & boot ---------- */
function render(){document.querySelectorAll('.notif-panel').forEach(p=>p.remove());
  if(!S.session)return loginView();
  if(S.session.role==='student'&&!me())return logout();
  shell()}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if(S.session){S.session.last=Date.now();saveSess()}},{passive:true}));
setInterval(()=>{if(S.session&&Date.now()-S.session.last>20*60000){logout();toast('تم تسجيل الخروج تلقائياً لحمايتك')}},30000);
(async()=>{D=migrate(load()||await seed());save();const ss=loadSess();if(ss&&Date.now()-ss.last<20*60000)S.session=ss;render()})();
</script>
