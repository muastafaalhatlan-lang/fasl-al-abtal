<style>
/* Layout: لوحة بشريط جانبي يمين (RTL) كما في الموقع المرجعي، بطاقات ملونة كبيرة تناسب الطفل */
:root{

  --f-body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A30; --bg-dot:#15253F; --surface:#16263F; --surface-2:#1C2F4D; --ink:#EEF4FF; --muted:#9FB0CF; --line:#253A5C;
  --sky:#5AA9FF; --sun:#FFCE5C; --grass:#46CE88; --coral:#FF8378; --grape:#A487FF; --orange:#FFA95A; --pink:#FF7DB4; --teal:#3FD0DA;
  --shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A30; --bg-dot:#15253F; --surface:#16263F; --surface-2:#1C2F4D; --ink:#EEF4FF; --muted:#9FB0CF; --line:#253A5C;
  --sky:#5AA9FF; --sun:#FFCE5C; --grass:#46CE88; --coral:#FF8378; --grape:#A487FF; --orange:#FFA95A; --pink:#FF7DB4; --teal:#3FD0DA;
  --shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.2); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dot) 2px,transparent 2px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl}

.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}

.btn.sm{padding:6px 12px;font-size:14px;border-radius:11px}
.input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 14px}

label.f{display:grid;gap:6px;font-weight:700}

.nav-link{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:14px;font-weight:800;text-align:start;color:var(--ink)}
.nav-link:hover{background:var(--surface-2)}

.nav-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--c);flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.nav-link .badge{margin-inline-start:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}

.main{margin-right:var(--side-w);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-bottom:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:14px;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h2{font-size:26px;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.icon-btn{border:0;width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:22px;position:relative;flex-shrink:0}
.icon-btn .dot{position:absolute;top:-4px;left:-4px;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:800}

  .side{transform:translateX(105%)} .side.open{transform:none}

  #menuBtn{display:block}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:40}
}
.content{display:grid;gap:18px}
.hero{border-radius:26px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--grape));display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(24px,4vw,34px)}
.hero .big{font-size:64px;line-height:1}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

.stat .n{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}

.tbl-wrap{overflow-x:auto;border-radius:14px}

th,td{padding:10px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:800;background:var(--surface-2)}
td.c,th.c{text-align:center}
.ck{font-size:18px}

.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-width:42px;padding:4px 10px;font-weight:800;font-family:var(--f-display);font-size:18px}

.surahs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.surah{border:0;border-radius:18px;padding:14px 10px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:6px;justify-items:center;font-weight:800}
.surah b{font-family:var(--f-display);font-size:21px}
.surah.done{background:color-mix(in srgb,var(--grass) 16%,var(--surface))}

.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;padding-top:10px}

.pod .ava{background:rgba(255,255,255,.35)}
.pod.p1{background:var(--sun);color:#3a2a00;min-height:180px}.pod.p2{background:var(--sky);min-height:145px}.pod.p3{background:var(--orange);min-height:120px}
.heroes{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

.hcard .ph{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:80px;background:linear-gradient(160deg,color-mix(in srgb,var(--sun) 50%,var(--surface)),color-mix(in srgb,var(--orange) 40%,var(--surface)))}
.hcard .ph img{width:100%;height:100%;object-fit:cover}
.hcard .bd{padding:12px;display:grid;gap:4px}
.hcard .crown{position:absolute;top:8px;right:8px;font-size:26px}
.qr-card{background:#fff;color:#1B2A4A;border-radius:18px;padding:14px;display:grid;gap:8px;justify-items:center;text-align:center;border:3px dashed #C9D9EE}

.qr-card .qr img,.qr-card .qr canvas{width:130px!important;height:130px!important}

.story{display:grid;gap:14px;justify-items:center;text-align:center}
.story .scene{font-size:96px;line-height:1.1;min-height:120px}
.story p{font-size:24px;font-family:var(--f-display);max-width:32ch;margin:0}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--sky)}
.notif-panel{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:60;padding:12px;display:grid;gap:8px}
.notif{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:var(--surface-2);border:0;text-align:start;width:100%}
.notif.unread{background:color-mix(in srgb,var(--sky) 14%,var(--surface))}

.game-q{font-family:var(--f-display);font-size:30px;text-align:center}

.progress{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}

.color-pick button.on{box-shadow:0 0 0 3px var(--ink)}

.plat.yt{background:#E5484D}.plat.tt{background:#1B2A4A}.plat.ot{background:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ======================================================
   منصة فصل الأبطال — نسخة تجريبية (تُحفظ البيانات في هذا المتصفح فقط)
   ====================================================== */
const KEY='fasl_abtal_demo_v1';
const SURAHS=['الفاتحة','الناس','الفلق','الإخلاص','المسد','النصر','الكافرون','الكوثر','الماعون','قريش','الفيل','الهمزة','العصر','التكاثر','القارعة'];
const LETTERS='ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن هـ و ي'.split(' ');
const ICONS=['🏠','🎮','📖','📝','✏️','📚','🌟','🏆','👥','⚙️','🛡️','🎨','🧮','🔤','🎵','🧪','🌍','🕌','🦁','🚀','🧩','🎁','📅','💬','🎬','🍎'];
const COLORS=['var(--sky)','var(--grass)','var(--sun)','var(--coral)','var(--grape)','var(--orange)','var(--pink)','var(--teal)'];
const AVAS=['🦁','🐯','🐼','🦊','🐨','🐸','🐵','🐻','🐰','🐧','🦉','🐬'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const token=(len=20)=>{const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';let t='';for(let i=0;i<len;i++)t+=ch[rnd(ch.length)];return t};
const pin=()=>String(1000+rnd(9000));
const fmt=t=>new Date(t).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}}

let D=null, S={session:null,view:'home',ui:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('⚠️ مساحة التخزين ممتلئة: احذف بعض الصور أو التسجيلات')}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function saveSess(){try{sessionStorage.setItem(KEY+'_s',JSON.stringify(S.session))}catch(e){}}
function loadSess(){try{return JSON.parse(sessionStorage.getItem(KEY+'_s'))}catch(e){return null}}

async function seed(){

/* نموذج عام: fields=[{k,label,type,options,value,ph}] */
function form(title,fields,onSubmit){
  window._fs=onSubmit;
  const f=fields.map(x=>{
    const id='fm_'+x.k;
    if(x.type==='select')return `<label class="f">${x.label}<select class="input" id="${id}">${x.options.map(o=>`<option value="${esc(o[0])}" ${o[0]==x.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    if(x.type==='textarea')return `<label class="f">${x.label}<textarea class="input" id="${id}" rows="${x.rows||4}" placeholder="${esc(x.ph||'')}">${esc(x.value||'')}</textarea></label>`;
    if(x.type==='file')return `<label class="f">${x.label}<input class="input" type="file" id="${id}" accept="${x.accept||''}"></label>`;
    return `<label class="f">${x.label}<input class="input" id="${id}" type="${x.type||'text'}" value="${esc(x.value||'')}" placeholder="${esc(x.ph||'')}" ${x.type==='url'?'dir="ltr"':''}></label>`;
  }).join('');
  modal(`<div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>
  <form id="fm" style="display:grid;gap:12px">${f}<div class="err" id="fm_err"></div><button class="btn green" type="submit">حفظ</button></form>`);
  $('#fm').onsubmit=async e=>{e.preventDefault();const v={};for(const x of fields){const el=$('#fm_'+x.k);v[x.k]=x.type==='file'?el.files[0]:el.value.trim()}
    const r=await window._fs(v);if(typeof r==='string'){$('#fm_err').textContent=r;return}closeLayer();render()};
}
function safeUrl(u){try{const x=new URL(u,location.href);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}
function platform(u){return /youtu/.test(u)?['yt','يوتيوب']:/tiktok/.test(u)?['tt','تيك توك']:['ot','رابط']}
function readImg(file,max=420){return new Promise((res,rej)=>{if(!file)return res('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function scanQR(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);

/* mini games */
const WORDS=[['ب','بطة','🦆'],['ت','تفاحة','🍎'],['س','سمكة','🐟'],['ق','قطة','🐱'],['ش','شمس','☀️'],['ف','فيل','🐘'],['ج','جمل','🐫'],['م','موز','🍌'],['ن','نحلة','🐝'],['ك','كرة','⚽'],['ز','زرافة','🦒'],['ح','حصان','🐴']];
let G=null;
function playGame(id){const g=D.games.find(x=>x.id===id);G={g,round:0,score:0,max:5};nextRound()}
function nextRound(){
  if(G.round>=G.max)return endGame();
  let q,opts,ans;
  if(G.g.kind==='letters'){const pool=[...WORDS].sort(()=>Math.random()-.5).slice(0,4);ans=rnd(4);q=`أي صورة تبدأ بحرف <b style="color:var(--grape);font-size:44px">${pool[ans][0]}</b> ؟`;opts=pool.map(w=>`${w[2]}<span>${w[1]}</span>`)}
  else{const n=1+rnd(9),e=['🍎','⭐','🐟','🎈','🌸'][rnd(5)];q=`<div style="font-size:38px;line-height:1.4">${e.repeat(n)}</div>كم عددها؟`;const set=new Set([n]);while(set.size<4)set.add(1+rnd(10));opts=[...set].sort(()=>Math.random()-.5);ans=opts.indexOf(n);opts=opts.map(x=>`<span style="font-size:40px">${x}</span>`)}
  G.ans=ans;G.lock=false;
  modal(`<div class="modal-h"><h3>${esc(G.g.icon)} ${esc(G.g.title)}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>
  <div class="progress"><i style="width:${G.round/G.max*100}%"></i></div><div class="row" style="justify-content:space-between"><small class="muted">سؤال ${G.round+1} من ${G.max}</small><b>⭐ ${G.score}</b></div>
  <div class="game-q">${q}</div><div class="game-opts">${opts.map((o,i)=>`<button class="game-opt" onclick="pick(${i},this)">${o}</button>`).join('')}</div>`);
}
function pick(i,el){if(G.lock)return;G.lock=true;const bs=document.querySelectorAll('.game-opt');bs[G.ans].classList.add('good');if(i===G.ans){G.score++}else el.classList.add('wrong');G.round++;setTimeout(nextRound,800)}
function endGame(){const s=me();if(s){D.scores.push({id:uid(),sid:s.id,gid:G.g.id,score:G.score,max:G.max,t:Date.now()});notify(`🎮 ${s.name} أنهى لعبة «${G.g.title}» بنتيجة ${G.score}/${G.max}`,'results');save()}
  modal(`<div class="story"><div class="scene">${G.score>=4?'🏆🎉':G.score>=2?'⭐👏':'💪🙂'}</div><h2>${G.score>=4?'رائع يا بطل!':G.score>=2?'أحسنت!':'حاول مرة أخرى'}</h2><p>نتيجتك ${G.score} من ${G.max}</p>${s?'':'<small class="muted">(وضع المعلم: لا تُحفظ النتيجة)</small>'}
  <div class="row"><button class="btn green" onclick="playGame('${G.g.id}')">العب مرة أخرى</button><button class="btn ghost" onclick="closeLayer();render()">إغلاق</button></div></div>`)}

    return tabs+`<label class="f" style="max-width:300px">اختر السورة<select class="input" onchange="S.ui.su=this.value;render()">${SURAHS.map(x=>`<option ${x===su?'selected':''}>${x}</option>`).join('')}</select></label>

  }

  return `<div class="card"><p style="margin:0">اختر السورة التي حفظتها، ثم سجّل صوتك وأرسله للمعلم 🎙️</p></div>

function recordFor(su){const st=status(me().id,su);if(st==='ok'||st==='new'){toast(st==='ok'?'سمّعت هذه السورة وقُبلت 🌟':'تسجيلك عند المعلم، انتظر قليلاً ⏳');return}
  modal(`<div class="modal-h"><h3>🎙️ تسميع سورة ${esc(su)}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>

  <label class="btn green" style="text-align:center;font-size:20px;padding:18px">🎤 سجّل صوتك<input type="file" accept="audio/*" capture hidden onchange="S.ui.af=this.files[0];document.getElementById('afn').textContent='✅ تم: '+this.files[0].name"></label>

  <div class="hint">في النسخة النهائية: زر تسجيل مباشر داخل الموقع مع إيقاف وإعادة الاستماع قبل الإرسال.</div>`)}
function sendRec(su,withAudio){const s=me();const f=S.ui.af;
  const fin=audio=>{D.recs.push({id:uid(),sid:s.id,surah:su,t:Date.now(),status:'new',audio});notify(`🎙️ تسجيل جديد: ${s.name} سمّع سورة ${su}`,'quran');save();S.ui.af=null;closeLayer();render();toast('أُرسل التسجيل للمعلم 🎉')};
  if(!withAudio)return fin('');if(!f){toast('سجّل صوتك أولاً');return}
  if(f.size>1.5e6){toast('التسجيل كبير للتجربة. سيُرسل بدون صوت');return fin('')}
  const fr=new FileReader();fr.onload=()=>fin(fr.result);fr.readAsDataURL(f)}

function cardHTML(s){return `<div class="qr-card"><b style="font-family:var(--f-display);font-size:20px">${esc(s.ava)} ${esc(s.name)}</b><div class="qr" id="qr_${s.id}"></div><div>المستخدم: <code>${esc(s.username)}</code></div><div>الرقم السري: <code>${esc(s.pin)}</code></div></div>`}
function drawQR(id,s){const el=document.getElementById(id);if(!el||!window.QRCode)return;el.innerHTML='';new QRCode(el,{text:'FASL1:'+s.qr,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}
function showCard(id){const s=stu(id);modal(`<div class="modal-h"><h3>بطاقة دخول الطالب</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>${cardHTML(s).replace('id="qr_','id="mqr_')}
  <div class="row"><button class="btn green" onclick="closeLayer();S.session=null;qrLogin('FASL1:${s.qr}')">📷 تجربة الدخول بالباركود</button><button class="btn ghost" onclick="newQR('${s.id}')">🔄 باركود جديد (يلغي القديم)</button></div>`);drawQR('mqr_'+s.id,s)}
function newQR(id){stu(id).qr=token();save();toast('تم توليد باركود جديد، البطاقة القديمة لم تعد تعمل');showCard(id)}
function resetPin(id){stu(id).pin=pin();save();S.ui.show=id;render();toast('تم توليد رقم سري جديد')}
function delStudent(id){D.students=D.students.filter(s=>s.id!==id);D.recs=D.recs.filter(r=>r.sid!==id);D.scores=D.scores.filter(r=>r.sid!==id);D.heroes=D.heroes.filter(r=>r.sid!==id);save();render();toast('تم الحذف')}
const TR={'ا':'a','أ':'a','إ':'e','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'w','ي':'y','ى':'a','ء':'','ئ':'e','ؤ':'o'};
function mkUser(name,want){let u=(want||[...name].map(c=>TR[c]??(/[a-z0-9]/i.test(c)?c:'')).join('')).toLowerCase().replace(/[^a-z0-9]/g,'')||'student';let b=u,i=2;while(D.students.some(s=>s.username===u))u=b+i++;return u}
function newStudent(name,u){const s={id:uid(),name,username:mkUser(name,u),pin:pin(),qr:token(),parent:'P-'+token(6).toUpperCase(),ava:AVAS[rnd(AVAS.length)],star:false,created:Date.now()};D.students.push(s);return s}
function addOne(){const n=$('#n1').value.trim();if(!n)return toast('اكتب اسم الطالب');newStudent(n,$('#u1').value.trim());save();S.ui.st='cards';render();toast('أُضيف الطالب ✅')}
function addList(){const ns=$('#nl').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ns.length)return toast('الصق الأسماء أولاً');ns.forEach(n=>newStudent(n));save();S.ui.st='cards';render();toast(`أُضيف ${ns.length} طالب ✅`)}
function addCSV(){const f=$('#cf').files[0];if(!f)return toast('اختر الملف');const fr=new FileReader();fr.onload=()=>{const rows=fr.result.replace(/^﻿/,'').split(/\r?\n/).map(l=>l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r[0]&&!/^(name|الاسم|اسم)$/i.test(r[0]));rows.forEach(r=>newStudent(r[0],r[1]));save();S.ui.st='cards';render();toast(`استُورد ${rows.length} طالب ✅`)};fr.readAsText(f,'utf-8')}

function saveMenu(id){const t=$('#mt').value.trim();if(!t)return toast('اكتب اسم القائمة');

    ['🌐','قاعدة بيانات آمنة على الخادم','في النسخة الفعلية: خادم مع اتصال HTTPS وصلاحيات على مستوى كل صف (Row-Level Security).','عند التنفيذ'],
    ['📧','تحقق بخطوتين للمعلم','رمز يصل لبريدك عند كل دخول من جهاز جديد.','عند التنفيذ'],
    ['🖼️','حماية الصور والتسجيلات','تخزين خاص بروابط مؤقتة، ولا تُفهرس في محركات البحث.','عند التنفيذ'],
    ['💾','نسخ احتياطي يومي','مع سجل لكل عملية دخول وتعديل.','عند التنفيذ']];
  return `<div class="sec-list">${L.map(x=>`<div class="sec-li"><span class="k">${x[0]}</span><div style="flex:1"><b>${x[1]}</b> <span class="pill ${x[3].includes('مفعّل')?'ok':'info'}">${x[3]}</span><br><span class="muted">${x[2]}</span></div></div>`).join('')}</div>

async function changeCreds(){const e=$('#ne').value.trim().toLowerCase(),p=$('#np').value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast('البريد غير صحيح');

  D.admin.email=e;save();render();toast('تم تحديث بيانات الدخول 🔐')}

/* Parent */
function vReport(){
  const s=me();const done=SURAHS.filter(x=>status(s.id,x)==='ok');const left=SURAHS.filter(x=>status(s.id,x)!=='ok');
  const sc=D.scores.filter(x=>x.sid===s.id).sort((a,b)=>b.t-a.t);const hero=D.heroes.filter(h=>h.sid===s.id);
  return `<div class="hint">👨‍👩‍👦 هذه الصفحة لولي الأمر: يتابع منها تقدم ابنه في السور والألعاب.</div>
  <div class="hero" style="background:linear-gradient(135deg,var(--orange),var(--coral))"><span class="big">${esc(s.ava)}</span><div style="flex:1"><h1>تقرير البطل ${esc(s.name)}</h1><p style="margin:4px 0 0">الصف الأول الابتدائي · ⭐ ${totalScore(s.id)} نقطة</p></div></div>
  <div class="stats">${[['📖',done.length+' / '+SURAHS.length,'سور سمّعها','var(--grass)'],['⏳',left.length,'سور متبقية','var(--coral)'],['🎮',sc.length,'محاولة لعب','var(--grape)'],['🌟',hero.length,'تكريم في لوحة الأبطال','var(--sun)']].map(x=>`<div class="card stat"><span class="nav-ic" style="background:${x[3]}">${x[0]}</span><div><div class="n">${x[1]}</div><small class="muted">${x[2]}</small></div></div>`).join('')}</div>
  <div class="card"><h3>تقدّمه في السور</h3><div class="progress" style="margin:10px 0"><i style="width:${done.length/SURAHS.length*100}%"></i></div>
  <div class="surahs">${SURAHS.map(x=>{const st=status(s.id,x);return `<div class="surah ${st==='ok'?'done':st==='new'?'pend':st==='rep'?'rep':''}"><span style="font-size:24px">${st==='ok'?'✅':st==='new'?'⏳':st==='rep'?'🔁':'⬜'}</span><b>${x}</b><small class="muted">${st==='ok'?'سمّعها':st==='new'?'عند المعلم':st==='rep'?'يحتاج إعادة':'لم يسمّعها'}</small></div>`}).join('')}</div></div>
  ${left.length?`<div class="card"><h3 style="color:var(--bad)">سور لم يسمّعها بعد</h3><p style="margin:6px 0 0">${left.map(esc).join('، ')}</p></div>`:''}
  <div class="card tbl-wrap"><h3 style="margin-bottom:8px">آخر نتائج الألعاب</h3><table><thead><tr><th>اللعبة</th><th class="c">النتيجة</th><th>الوقت</th></tr></thead><tbody>${sc.slice(0,10).map(x=>`<tr><td>${esc((D.games.find(g=>g.id===x.gid)||{}).title||'—')}</td><td class="c">${x.score}/${x.max}</td><td>${fmt(x.t)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">لا توجد نتائج بعد</td></tr>'}</tbody></table></div>`;
}

/* ---------- Render & boot ---------- */
function render(){document.querySelectorAll('.notif-panel').forEach(p=>p.remove());
  if(!S.session)return loginView();
  if(S.session.role==='student'&&!me())return logout();
  shell()}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if(S.session){S.session.last=Date.now();saveSess()}},{passive:true}));
setInterval(()=>{if(S.session&&Date.now()-S.session.last>20*60000){logout();toast('تم تسجيل الخروج تلقائياً لحمايتك')}},30000);
(async()=>{D=load()||await seed();save();const ss=loadSess();if(ss&&Date.now()-ss.last<20*60000)S.session=ss;render()})();
</script>
