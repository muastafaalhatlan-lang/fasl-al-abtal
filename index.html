<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F8FF7">
<meta name="description" content="منصة فصل الأبطال للصف الأول الابتدائي - مدرسة طارق بن زياد بالدمام">
<title>منصة فصل الأبطال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
html,body{margin:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-band:empty{display:none}
/* Layout: لوحة بشريط جانبي يمين (RTL) كما في الموقع المرجعي، بطاقات ملونة كبيرة تناسب الطفل */
:root{
  --bg:#EAF5FF; --bg-dot:#D3E9FF; --surface:#FFFFFF; --surface-2:#F4F9FF; --ink:#1B2A4A; --muted:#5A6B8E; --line:#DCE7F5;
  --sky:#2F8FF7; --sun:#FFC23D; --grass:#2FB872; --coral:#FF6B5E; --grape:#8A63F0; --orange:#FF9433; --pink:#F45FA0; --teal:#14B8C4;
  --ok:#22A866; --warn:#E89B0C; --bad:#E5484D;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --side-w:272px; --r:18px; --shadow:0 6px 0 rgba(27,42,74,.08),0 10px 24px rgba(27,42,74,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A30; --bg-dot:#15253F; --surface:#16263F; --surface-2:#1C2F4D; --ink:#EEF4FF; --muted:#9FB0CF; --line:#253A5C;
  --sky:#5AA9FF; --sun:#FFCE5C; --grass:#46CE88; --coral:#FF8378; --grape:#A487FF; --orange:#FFA95A; --pink:#FF7DB4; --teal:#3FD0DA;
  --shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A30; --bg-dot:#15253F; --surface:#16263F; --surface-2:#1C2F4D; --ink:#EEF4FF; --muted:#9FB0CF; --line:#253A5C;
  --sky:#5AA9FF; --sun:#FFCE5C; --grass:#46CE88; --coral:#FF8378; --grape:#A487FF; --orange:#FFA95A; --pink:#FF7DB4; --teal:#3FD0DA;
  --shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.2); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dot) 2px,transparent 2px);background-size:26px 26px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;direction:rtl}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:800;background:var(--sky);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.green{background:var(--grass)}.btn.coral{background:var(--coral)}.btn.sun{background:var(--sun);color:#3a2a00}.btn.grape{background:var(--grape)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:11px}
.input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 14px}
.input{min-width:0;max-width:100%}
input[type=date].input{-webkit-appearance:none;appearance:none;display:block;min-height:46px}
.input:focus{border-color:var(--sky);outline:none}
label.f{display:grid;gap:6px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--sky)}
.demo-band{background:var(--sun);color:#3a2a00;text-align:center;font-weight:800;font-size:14px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:920px;min-width:0;display:grid;gap:24px}
.brand-hero{text-align:center;display:grid;gap:6px;justify-items:center}
.mascot{font-size:72px;line-height:1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.brand-hero h1{font-size:clamp(34px,6vw,54px);color:var(--sky);letter-spacing:0}
.brand-hero h1 span{color:var(--orange)}
.doors{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));max-width:640px;width:100%;margin-inline:auto}
.school{margin:4px 0 0;font-weight:800;font-size:17px;background:var(--surface);border-radius:999px;padding:4px 16px;box-shadow:var(--shadow)}
.credit{text-align:center;color:var(--muted);font-size:14px;margin:0}
.credit b{color:var(--ink);white-space:nowrap}
.door{border:0;text-align:center;border-radius:26px;padding:26px 18px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.16);display:grid;gap:8px;justify-items:center;transition:transform .15s}
.door:hover{transform:translateY(-4px)}
.door .ic{font-size:54px;line-height:1}
.door b{font-family:var(--f-display);font-size:26px}
.door small{opacity:.92;font-size:15px}
.door.st{background:linear-gradient(160deg,var(--grass),var(--teal))}
.door.ad{background:linear-gradient(160deg,var(--grape),var(--sky))}
.door.pa{background:linear-gradient(160deg,var(--orange),var(--coral))}
.login-form{max-width:440px;width:100%;margin-inline:auto;display:grid;gap:14px}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 12px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hint{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-radius:14px;padding:10px 14px;font-size:14px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}

/* ---------- Shell ---------- */
.side{position:fixed;top:0;bottom:0;right:0;width:var(--side-w);background:var(--surface);box-shadow:-4px 0 20px rgba(27,42,74,.06);display:flex;flex-direction:column;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);transition:transform .25s}
.side-brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.side-brand .logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,var(--sun),var(--orange));display:grid;place-items:center;font-size:26px;flex-shrink:0}
.side-brand b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.side-brand small{color:var(--muted);font-size:12px}
.side-user{margin:0 14px 8px;background:var(--surface-2);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--sun) 40%,var(--surface));flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.side-nav{overflow-y:auto;padding:4px 12px 16px;flex:1}
.nav-cat{font-size:12px;font-weight:800;color:var(--muted);padding:14px 8px 6px;letter-spacing:.02em}
.nav-link{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:14px;font-weight:800;text-align:start;color:var(--ink)}
.nav-link:hover{background:var(--surface-2)}
.nav-link.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink)}
.nav-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--c);flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.nav-link .badge{margin-inline-start:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}
.side-foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px dashed var(--line)}
.main{margin-right:var(--side-w);min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-bottom:40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:14px;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h2{font-size:26px;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.icon-btn{border:0;width:46px;height:46px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:22px;position:relative;flex-shrink:0}
.icon-btn .dot{position:absolute;top:-4px;left:-4px;background:var(--coral);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;font-weight:800}
#menuBtn{display:none}
.scrim{display:none}
@media (max-width:900px){
  .side{transform:translateX(105%)} .side.open{transform:none}
  .main{margin-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  #menuBtn{display:block}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:40}
}
.content{display:grid;gap:18px}
.hero{border-radius:26px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--sky),var(--grape));display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(24px,4vw,34px)}
.hero .big{font-size:64px;line-height:1}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{display:flex;gap:12px;align-items:center}
.stat .n{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.tile{border:0;text-align:center;border-radius:22px;padding:20px 12px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:10px;justify-items:center;font-weight:800;font-size:17px;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.kashf{padding:12px}
.kt{min-width:0;width:100%;table-layout:fixed}
.kt th,.kt td{white-space:normal;padding:8px 4px;font-size:14px;overflow-wrap:anywhere}
.kt th:first-child,.kt td.kn{width:34%;text-align:start}
.kl{display:none;gap:8px}
.kr{padding:10px;border-radius:12px;background:var(--surface-2);display:grid;gap:6px}
.kh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kh b{min-width:0;overflow-wrap:anywhere}
.kc{display:flex;flex-wrap:wrap;gap:5px}
.kchip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;color:var(--ink)}
.kchip:active,.kcell:active{transform:scale(.94)}
.kcell{border:0;background:transparent;font-size:20px;padding:4px;border-radius:10px;cursor:pointer}
.kcell:hover,.kchip:hover{background:color-mix(in srgb,var(--sky) 14%,var(--surface))}
@media (max-width:700px){.kt{display:none}.kl{display:grid}}
.lt-hero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--coral),var(--orange));display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.lt-hero h1{font-size:clamp(24px,5vw,32px)}.lt-hero p{margin:2px 0 0;opacity:.95}
.lt-pencil{font-size:54px;line-height:1;animation:wiggle 2.4s ease-in-out infinite}
.lt-tabs button{font-size:15px}
.lt-unit{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;border-top:8px solid var(--uc)}
.lt-uh{display:flex;align-items:center;gap:10px}
.lt-ui{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--uc) 22%,var(--surface));flex-shrink:0}
.lt-uh small{color:var(--muted);font-weight:800}.lt-uh h3{font-size:24px;color:var(--uc)}
.lt-cnt{margin-inline-start:auto;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.lt-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.lt-tile{position:relative;border:0;border-radius:20px;aspect-ratio:1/1.1;max-width:100%;background:color-mix(in srgb,var(--uc) 13%,var(--surface));box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 35%,transparent);display:grid;place-items:center;align-content:center;gap:0;transition:transform .15s}
.lt-tile:hover{transform:translateY(-3px) rotate(-2deg)}
.lt-tile:active{transform:translateY(3px);box-shadow:none}
.lt-big{font-family:var(--f-display);font-size:54px;line-height:1.15;color:var(--uc);font-weight:800}
.lt-w{font-size:22px;line-height:1}
.lt-n{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--uc);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.lt-v{position:absolute;top:6px;left:6px;font-size:11px;font-weight:800;background:var(--surface);border-radius:999px;padding:1px 6px;color:var(--coral)}
.lt-card{border-radius:28px;padding:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--uc) 25%,var(--surface)),var(--surface));box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;justify-content:space-around;flex-wrap:wrap;border:3px solid color-mix(in srgb,var(--uc) 40%,transparent)}
.lt-hugeW{display:grid;justify-items:center}
.lt-huge{font-family:var(--f-display);font-size:clamp(110px,30vw,170px);line-height:1.1;color:var(--uc);font-weight:800}
.lt-name{font-family:var(--f-display);font-size:24px;font-weight:800}
.lt-ex{display:grid;justify-items:center;gap:4px;background:var(--surface);border-radius:22px;padding:14px 22px;box-shadow:var(--shadow)}
.lt-exe{font-size:64px;line-height:1}.lt-ex b{font-family:var(--f-display);font-size:28px}
.lt-forms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lt-form{background:var(--surface-2);border-radius:16px;padding:10px 4px;display:grid;justify-items:center;gap:2px;text-align:center}
.lt-form span{font-family:var(--f-display);font-size:44px;line-height:1.3;color:var(--ink)}
.lt-form small{color:var(--muted);font-weight:800;font-size:12px}
@media (max-width:520px){.lt-forms{grid-template-columns:repeat(2,1fr)}}
.lt-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.lt-frame.tt{aspect-ratio:9/16;max-height:70vh;width:auto;margin-inline:auto}
.lt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gm-hero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--grape),var(--pink));display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.gm-hero h1{font-size:clamp(24px,5vw,32px)}.gm-hero p{margin:2px 0 0;opacity:.95}
.gm-joy{font-size:54px;line-height:1;animation:bob 2.6s ease-in-out infinite}
.gc-nav .chip{font-size:15px;font-family:var(--f-body)}
.gc-nav .chip.on{background:var(--cc,var(--sky));border-color:var(--cc,var(--sky))}
.gsec{display:grid;gap:12px;background:var(--surface);border-radius:24px;padding:14px;box-shadow:var(--shadow);border-top:8px solid var(--gc)}
.gsec-h{display:flex;align-items:center;gap:10px}
.gsec-i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--gc) 22%,var(--surface));flex-shrink:0}
.gsec-h h3{font-size:24px;color:var(--gc)}
.ggrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.gcard{background:var(--surface-2);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 0 color-mix(in srgb,var(--gc) 30%,transparent)}
.gc-cover{position:relative;border:0;padding:0;width:100%;aspect-ratio:4/3;max-width:100%;overflow:hidden;cursor:pointer;perspective:700px;
  --gcd:color-mix(in srgb,var(--gc) 55%,#0b1020);--gcl:color-mix(in srgb,var(--gc) 45%,#ffffff);
  background:radial-gradient(120% 90% at 50% 0%,var(--gcl),var(--gc) 55%,var(--gcd));box-shadow:inset 0 0 0 4px rgba(255,255,255,.28),inset 0 -14px 24px rgba(0,0,0,.22)}
.gc-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.12) 34%,transparent 36%);pointer-events:none;z-index:2}
.gc-rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 10deg,transparent 10deg 24deg);animation:spin 26s linear infinite}
.gc-scene{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d;transition:transform .35s ease}
.gcard:hover .gc-scene,.gc-cover:focus-visible .gc-scene{transform:rotateX(10deg) rotateY(-12deg)}
.gc-floor{position:absolute;bottom:30%;left:50%;width:46%;height:10%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);animation:floor 3s ease-in-out infinite}
.gc-emoji{position:relative;top:-11%;font-size:clamp(44px,12.5vw,66px);line-height:1;transform:translateZ(22px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.18)) drop-shadow(0 14px 14px rgba(0,0,0,.3));animation:gfloat 3s ease-in-out infinite}
.gc-title{position:absolute;bottom:8%;left:6%;right:6%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,4.6vw,22px);line-height:1.2;color:#fff;transform:translateZ(14px);
  text-shadow:0 1px 0 var(--gcd),0 2px 0 var(--gcd),0 3px 0 var(--gcd),0 4px 0 var(--gcd),0 5px 0 color-mix(in srgb,var(--gcd) 80%,#000),0 8px 12px rgba(0,0,0,.35);-webkit-text-stroke:.5px rgba(0,0,0,.15)}
.gc-spark{position:absolute;font-size:16px;animation:twinkle 2.2s ease-in-out infinite;z-index:1}
.gc-spark.s1{top:10%;right:12%}.gc-spark.s2{top:22%;left:10%;animation-delay:.7s;font-size:12px}.gc-spark.s3{top:40%;right:6%;animation-delay:1.3s;font-size:11px}
.gc-cover.has-img{background:var(--gcd)}
.gc-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.gcard:hover .gc-cover img{transform:scale(1.06)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gfloat{50%{transform:translateZ(22px) translateY(-6px) rotate(-4deg)}}
@keyframes floor{50%{transform:translateX(-50%) scale(.8);opacity:.7}}
@keyframes twinkle{50%{transform:scale(.5);opacity:.3}}

function genWords(...texts){const out=[];const add=w=>{if(w&&!out.includes(w))out.push(w)};
  texts.join(' ').replace(/[ً-ْٰـ]/g,'').split(/[\s،,.!?؟:؛"'()\-|]+/).forEach(w=>{if(!w)return;let k=w;
    for(const t of [k,k.replace(/^(و|ف|ب|ل|ك)/,''),k.replace(/^ال/,''),k.replace(/^(و|ف|ب|ل|ك)ال/,''),k.replace(/^لل/,'')]){if(AR_EN[t]){add(AR_EN[t]);break}}});
  for(const ch of Array.from(texts.join(' ')))if(EMO_EN[ch])add(EMO_EN[ch]);
  for(const e in EMO_EN)if(e.length>1&&texts.join(' ').includes(e))add(EMO_EN[e]);
  return out.slice(0,8)}

async function brandStamp(src,txt){if(!txt)return src;const im=new Image();im.src=src;await im.decode();
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);
  const H=c.height,bh=Math.max(34,Math.round(Math.min(H,c.width*.75)*.13));
  const gr=g.createLinearGradient(0,H-bh*1.7,0,H);gr.addColorStop(0,'rgba(10,16,40,0)');gr.addColorStop(.45,'rgba(10,16,40,.55)');gr.addColorStop(1,'rgba(10,16,40,.88)');g.fillStyle=gr;g.fillRect(0,H-bh*1.7,c.width,bh*1.7);
  let fs=Math.round(bh*.5);try{await document.fonts.load(`800 ${fs}px "Baloo Bhaijaan 2"`)}catch(e){}
  const t='⭐ '+txt+' ⭐';g.direction='rtl';g.textAlign='center';g.textBaseline='middle';
  do{g.font=`800 ${fs}px "Baloo Bhaijaan 2","Tajawal",sans-serif`;if(g.measureText(t).width<c.width*.92)break;fs-=2}while(fs>10);
  g.lineWidth=Math.max(2,fs*.12);g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(t,c.width/2,H-bh*.55);g.fillStyle='#FFD45E';g.fillText(t,c.width/2,H-bh*.55);
  return smallURL(c)}

const WORDS=[['ب','بطة','🦆'],['ت','تفاحة','🍎'],['س','سمكة','🐟'],['ق','قطة','🐱'],['ش','شمس','☀️'],['ف','فيل','🐘'],['ج','جمل','🐫'],['م','موز','🍌'],['ن','نحلة','🐝'],['ك','كرة','⚽'],['ز','زرافة','🦒'],['ح','حصان','🐴']];

function nextRound(){

}
function pick(i,el){if(G.lock)return;G.lock=true;const bs=document.querySelectorAll('.game-opt');bs[G.ans].classList.add('good');if(i===G.ans){G.score++}else el.classList.add('wrong');G.round++;setTimeout(nextRound,800)}

  if(isAdmin()){
    const tab=S.ui.qt||'asg';
    const tabs=`<div class="tabs" style="max-width:560px">${[['asg','🚪 الواجبات والتسجيلات'],['sheet','📋 كشف المتابعة'],['who','🔎 من سمّع ومن لم يسمّع']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="S.ui.qt='${t[0]}';S.ui.pa=null;render()">${t[1]}</button>`).join('')}</div>`;
    if(tab==='asg')return tabs+portalAdmin();
    if(tab==='sheet'){const sl=SL(),ic=(sid,x)=>{const r=surahSub(sid,x);return !r?'⬜':!r.rating?'⏳':RATING[r.rating].e},cb=(sid,x)=>`onclick="classRate('${sid}',surahAsg(${esc(JSON.stringify(x)).replace(/"/g,'&quot;')}).id)"`;
      if(!sl.length)return tabs+'<div class="card lock"><div class="emoji">📋</div><p class="muted">لا توجد سور بعد. أضف أول واجب تسميع.</p></div>';
      return tabs+`<p class="muted" style="margin:0">🏆 ممتاز · 👍 جيد · 💪 غير متقن · ⏳ بانتظار استماعك · ⬜ لم يسمّع<br><b>اضغط على أي سورة لتقييم الطالب (ولو سمّع عندك في الصف)</b></p>
      <div class="card kashf"><table class="kt"><thead><tr><th>الطالب</th>${sl.map(x=>`<th class="c">${esc(x)}</th>`).join('')}<th class="c">✅</th></tr></thead><tbody>
      ${D.students.map(s=>`<tr><td class="kn">${esc(s.name)}</td>${sl.map(x=>`<td class="c ck"><button class="kcell" ${cb(s.id,x)} aria-label="${esc(x)}">${ic(s.id,x)}</button></td>`).join('')}<td class="c"><b>${sl.filter(x=>status(s.id,x)==='ok').length}/${sl.length}</b></td></tr>`).join('')}</tbody></table>
      <div class="kl">${D.students.map(s=>`<div class="kr"><div class="kh"><b>${esc(s.name)}</b><span class="pill ok">${sl.filter(x=>status(s.id,x)==='ok').length}/${sl.length}</span></div><div class="kc">${sl.map(x=>`<button class="kchip" ${cb(s.id,x)}>${ic(s.id,x)} ${esc(x)}</button>`).join('')}</div></div>`).join('')}</div></div>`}
    if(!SL().length)return tabs+'<div class="card lock"><div class="emoji">📖</div><p class="muted">لا توجد سور بعد. أضف أول واجب تسميع وستظهر سورته هنا.</p></div>';const su=S.ui.su&&SL().includes(S.ui.su)?S.ui.su:SL()[SL().length-1];const did=D.students.filter(s=>status(s.id,su)==='ok'),not=D.students.filter(s=>status(s.id,su)!=='ok');
    return tabs+`<label class="f" style="max-width:300px">اختر السورة<select class="input" onchange="S.ui.su=this.value;render()">${SL().map(x=>`<option ${x===su?'selected':''}>${x}</option>`).join('')}</select></label>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3 style="color:var(--ok)">سمّعوا (${did.length})</h3><div class="sec-list" style="margin-top:10px">${did.map(s=>`<div class="row">${ava(s)}${esc(s.name)}</div>`).join('')||'<p class="muted">لا أحد بعد</p>'}</div></div>
      <div class="card"><h3 style="color:var(--bad)">لم يسمّعوا (${not.length})</h3><div class="sec-list" style="margin-top:10px">${not.map(s=>`<div class="row">${ava(s)}${esc(s.name)} ${status(s.id,su)==='new'?'<span class="pill warn">بانتظارك</span>':''}</div>`).join('')||'<p class="muted">الجميع سمّع 🎉</p>'}</div></div></div>`;
  }
  return portalStudent();
}

/* Sheets */
const FTYPE=t=>/html?$|text\/html/i.test(t)?['🧩','ورقة تفاعلية']:/pdf/i.test(t)?['📄','PDF']:/image/i.test(t)?['🖼️','صورة']:/word|docx?$/i.test(t)?['📝','Word']:/powerpoint|presentation|pptx?$/i.test(t)?['📊','عرض']:['📎','ملف'];
function vSheets(){
  const f=S.ui.sf||'all';const list=D.sheets.filter(x=>f==='all'||x.kind===f);
  return `<div class="sh-hero pop"><span class="sh-i">📝</span><div><h1>أوراق العمل</h1><p>اطبعها وحلّها، أو حلّها على الجهاز</p></div></div>
  <div class="sec-head"><div class="tabs">${[['all','الكل'],['paper','🖨️ ورقية'],['online','💻 إلكترونية']].map(t=>`<button class="${f===t[0]?'on':''}" onclick="S.ui.sf='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${adminBar('إضافة ورقة عمل','addSheet()')}</div>
  <div class="grid">${list.map(x=>{const ft=x.file?FTYPE(x.ftype||x.fname||''):null;const paper=x.kind==='paper';return `<div class="card item sh-card" style="--sc:${paper?'var(--orange)':'var(--sky)'}">
    <div class="row" style="justify-content:space-between"><span class="emoji">${ft?ft[0]:paper?'🖨️':'💻'}</span><span class="pill ${paper?'warn':'info'}">${paper?'ورقية للطباعة':'إلكترونية تفاعلية'}</span></div>
    <h4>${esc(x.title)}</h4>${x.note?`<p class="muted" style="margin:0">${esc(x.note)}</p>`:''}${ft?`<small class="muted">${ft[1]}${x.size?' · '+kb(x.size):''}${x.html&&isAdmin()?(x.scores?' · ✓ تُسجَّل الدرجات':' · لا ترسل الدرجات'):''}</small>`:''}
    <div class="row">${x.file?(x.html?`<button class="btn" data-sfx onclick="sfx('open');openSheet('${x.id}')">✏️ افتح وحلّ</button>`:`<button class="btn ${paper?'sun':''}" data-sfx onclick="sfx('open');openSheet('${x.id}')">${paper?'🖨️ افتح واطبع':'✏️ افتح وحلّ'}</button><button class="btn ghost sm" onclick="openSheet('${x.id}',1)">⬇️ تحميل</button>`)
      :`<a class="btn ${paper?'sun':''}" href="${safeUrl(x.url)}" target="_blank" rel="noopener">${paper?'تحميل وطباعة':'ابدأ الحل'}</a>`}${delBtn(`confirmBox('حذف الورقة؟',()=>delSheet('${x.id}'))`)}</div></div>`}).join('')||'<div class="card lock"><div class="emoji">📝</div><p class="muted">لا توجد أوراق بعد</p></div>'}</div>`;
}
async function openSheet(id,dl){const x=D.sheets.find(s=>s.id===id);if(!x||!x.file)return;if(x.html)return openFileGame(id,{id,title:x.title,icon:'📝',key:'sheet_'+id});toast('⏳ جارٍ فتح الملف...');
  const b=await STORE.get('sheet_'+id);if(!b){toast('تعذّر فتح الملف، تحقق من الإنترنت');return}
  const blob=b.type&&b.type!=='application/octet-stream'?b:new Blob([b],{type:x.ftype||'application/octet-stream'});const u=URL.createObjectURL(blob);
  if(dl||!/pdf|image/i.test(blob.type)){const a=document.createElement('a');a.href=u;a.download=x.fname||x.title;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return}
  if(/image/i.test(blob.type)){modal(`<div class="modal-h"><h3>${esc(x.title)}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div><img src="${u}" alt="${esc(x.title)}" style="border-radius:12px;width:100%"><a class="btn sun" href="${u}" download="${esc(x.fname||'worksheet')}" style="text-align:center">⬇️ تحميل للطباعة</a>`,true);return}
  const w=window.open(u,'_blank');if(!w){const a=document.createElement('a');a.href=u;a.target='_blank';document.body.appendChild(a);a.click();a.remove()}setTimeout(()=>URL.revokeObjectURL(u),120000)}
async function delSheet(id){const x=D.sheets.find(s=>s.id===id);if(x&&x.file)await STORE.del('sheet_'+id);D.sheets=D.sheets.filter(s=>s.id!==id);save();sfx('del');render()}
function addSheet(){form('📝 إضافة ورقة عمل',[{k:'title',label:'عنوان الورقة'},{k:'kind',label:'النوع',type:'select',options:[['paper','🖨️ ورقية (للطباعة)'],['online','💻 إلكترونية (تُحل على الجهاز)']]},{k:'file',label:'📁 ارفع ملف الورقة: تفاعلية HTML مثل الألعاب، أو PDF، أو صورة، أو Word',type:'file',accept:'.html,.htm,text/html,.pdf,image/*,.doc,.docx,.ppt,.pptx'},{k:'url',label:'🔗 أو الصق رابط الورقة',type:'url',ph:'https://...'},{k:'note',label:'ملاحظة للطالب (اختياري)'}],async v=>{
  if(!v.title)return 'اكتب عنوان الورقة';if(!v.file&&!v.url)return 'ارفع ملف الورقة أو الصق رابطها';const id=uid();
  if(v.file&&/\.html?$/i.test(v.file.name||'')||v.file&&/html/i.test(v.file.type||'')){if(v.file.size>20e6)return 'الملف كبير جداً (الحد 20MB)';let txt='';try{txt=await v.file.text()}catch(e){return 'تعذّرت قراءة الملف'}
    if(!/<html|<!doctype|<script|<body/i.test(txt))return 'هذا ليس ملف HTML صحيحاً';try{await STORE.put('sheet_'+id,new Blob([txt],{type:'text/html'}))}catch(e){return 'تعذّر رفع الملف، تحقق من الإنترنت'}
    const scores=/fasl-score/.test(txt);D.sheets.unshift({id,title:v.title,kind:'online',note:v.note,file:true,html:true,scores,fname:v.file.name,ftype:'text/html',size:v.file.size,t:Date.now()});save();toast(scores?'✅ رُفعت الورقة التفاعلية، ودرجات الطلاب ستُسجَّل':'✅ رُفعت الورقة التفاعلية');return}
  if(v.file){if(v.file.size>20e6)return 'الملف كبير جداً (الحد 20MB)';try{await STORE.put('sheet_'+id,v.file)}catch(e){return 'تعذّر رفع الملف، تحقق من الإنترنت'}
    D.sheets.unshift({id,title:v.title,kind:v.kind,note:v.note,file:true,fname:v.file.name,ftype:v.file.type||'',size:v.file.size,t:Date.now()});save();toast('✅ رُفعت ورقة العمل');return}
  if(!/^https:\/\//.test(v.url))return 'الرابط يجب أن يبدأ بـ https://';D.sheets.unshift({id,title:v.title,kind:v.kind,note:v.note,url:v.url,t:Date.now()});save();toast('تمت الإضافة')})}

/* Letters */
/* ---------- طريقة كتابة الحروف: حسب منهج لغتي ---------- */
const CURR=[
  {sem:'الفصل الدراسي الأول',units:[
    {name:'أسرتي',icon:'🏠',color:'var(--coral)',letters:['م','ب','ل','د','ن','ر']},
    {name:'مدرستي',icon:'🏫',color:'var(--sky)',letters:['ص','ف','س','ق','ت','ح']},
    {name:'مدينتي',icon:'🏙️',color:'var(--grape)',letters:['أ','ط','ز','و','ج','ش']}]},
  {sem:'الفصل الدراسي الثاني',units:[
    {name:'صحتي وسلامتي',icon:'🩺',color:'var(--grass)',letters:['ض','ع','ك','خ','ي','ذ']},
    {name:'ألعابي وهواياتي',icon:'🎈',color:'var(--orange)',letters:['هـ','ث','غ','ظ']}]}];
const LWORD={'م':['موز','🍌'],'ب':['بطة','🦆'],'ل':['ليمون','🍋'],'د':['دب','🐻'],'ن':['نحلة','🐝'],'ر':['ريشة','🪶'],
  'ص':['صقر','🦅'],'ف':['فيل','🐘'],'س':['سمكة','🐟'],'ق':['قطة','🐱'],'ت':['تفاحة','🍎'],'ح':['حصان','🐴'],
  'أ':['أرنب','🐰'],'ط':['طائرة','✈️'],'ز':['زرافة','🦒'],'و':['وردة','🌹'],'ج':['جمل','🐫'],'ش':['شمس','☀️'],
  'ض':['ضفدع','🐸'],'ع':['عنب','🍇'],'ك':['كرة','⚽'],'خ':['خروف','🐑'],'ي':['يد','✋'],'ذ':['ذرة','🌽'],
  'هـ':['هدية','🎁'],'ث':['ثعلب','🦊'],'غ':['غيمة','☁️'],'ظ':['ظرف','✉️']};
const NOJOIN='أادذرزو';
const LNAME={'م':'الميم','ب':'الباء','ل':'اللام','د':'الدال','ن':'النون','ر':'الراء','ص':'الصاد','ف':'الفاء','س':'السين','ق':'القاف','ت':'التاء','ح':'الحاء','أ':'الألف','ط':'الطاء','ز':'الزاي','و':'الواو','ج':'الجيم','ش':'الشين','ض':'الضاد','ع':'العين','ك':'الكاف','خ':'الخاء','ي':'الياء','ذ':'الذال','هـ':'الهاء','ث':'الثاء','غ':'الغين','ظ':'الظاء'};
const normL=l=>l==='ا'||l==='إ'||l==='آ'?'أ':l==='ه'?'هـ':l;
const ALL_L=CURR.flatMap(s=>s.units.flatMap(u=>u.letters.map(l=>({l,u}))));
function lForms(l){const b=l==='هـ'?'ه':l;return NOJOIN.includes(b)?[b,b,'ـ'+b,'ـ'+b]:[b,b+'ـ','ـ'+b+'ـ','ـ'+b]}
const lVideos=l=>(D.videos||[]).filter(v=>normL(v.letter)===l);
function ytId(u){const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:''}
function ttId(u){const m=String(u).match(/\/video\/(\d{8,})/);return m?m[1]:''}
function vLetters(){
  const sel=S.ui.lt?normL(S.ui.lt):'';if(sel&&LNAME[sel])return letterPage(sel);
  const si=S.ui.sem||0;
  return `<div class="lt-hero pop"><span class="lt-pencil">✏️</span><div><h1>نتعلم كتابة الحروف</h1><p>حسب منهج لغتي، حرفاً بعد حرف</p></div></div>
  <div class="tabs lt-tabs">${CURR.map((s,i)=>`<button class="${si===i?'on':''}" onclick="S.ui.sem=${i};render()">${i?'🌷':'🌱'} ${s.sem}</button>`).join('')}</div>
  ${CURR[si].units.map((u,ui)=>{const cv=D.custom&&D.custom['_ucover_'+u.name];return `<section class="lt-unit pop" style="--uc:${u.color}">
    ${cv?`<div class="lt-cover"><img src="${cv}" alt="${u.name}"></div>`:''}
    <div class="lt-uh"><span class="lt-ui">${u.icon}</span><div><small>الوحدة ${['الأولى','الثانية','الثالثة'][ui]||''}</small><h3>${u.name}</h3></div><span class="lt-cnt">${u.letters.length} حروف</span>${isAdmin()?`<button class="btn sm ghost" onclick="unitCover('${u.name}')">🖼️ الغلاف</button>`:''}</div>
    <div class="lt-grid">${u.letters.map((l,i)=>{const n=lVideos(l).length;return `<button class="lt-tile" onclick="S.ui.lt='${l}';render();scrollTo(0,0)" aria-label="حرف ${LNAME[l]}">
      <span class="lt-n">${i+1}</span><span class="lt-big">${l}</span><span class="lt-w">${LWORD[l][1]}</span>${n?`<span class="lt-v">▶ ${n}</span>`:''}</button>`}).join('')}</div>
  </section>`}).join('')}`;
}
/* ---------- حرف اليوم (يختاره المعلم) ---------- */
const dayLetter=()=>{const d=D.custom&&D.custom._dayletter;return d&&LNAME[d.l]?d:null};
const dlDone=(sid,l)=>(D.scores||[]).filter(x=>x.sid===sid&&x.gid==='dl_'+l).sort((a,b)=>b.score-a.score)[0];
const dlCount=sid=>new Set((D.scores||[]).filter(x=>x.sid===sid&&String(x.gid).startsWith('dl_')).map(x=>x.gid)).size;
function dayLetterCard(){const d=dayLetter(),s=me();
  if(isAdmin())return `<div class="dl-card dl-admin pop">${d?`<span class="dl-big">${d.l}</span>`:'<span class="dl-big">🔤</span>'}<div style="flex:1;min-width:0"><small>حرف اليوم</small><b>${d?'حرف '+LNAME[d.l]:'لم تختر حرف اليوم بعد'}</b>${d&&d.msg?`<div class="muted">💬 ${esc(d.msg)}</div>`:''}
    ${d?`<div class="muted">أنهى التحدي: ${D.students.filter(x=>dlDone(x.id,d.l)).length} من ${D.students.length}</div>`:''}</div><button class="btn sun" data-sfx onclick="sfx('open');pickDayLetter()">${d?'✏️ تغيير':'🔤 اختر الحرف'}</button></div>`;
  if(!s||!d)return '';const w=LWORD[d.l],f=lForms(d.l),done=dlDone(s.id,d.l);
  return `<div class="dl-card pop"><div class="dl-top"><span class="dl-tag">🔤 حرف اليوم</span>${done?`<span class="pill ok">✅ أنجزت التحدي · ⭐ ${done.score}/${done.max}</span>`:''}</div>
    <div class="dl-main"><span class="dl-big">${d.l}</span><div class="dl-ex"><span>${w[1]}</span><b>${w[0]}</b></div></div>
    <div class="dl-name">حرف ${LNAME[d.l]}</div>${d.msg?`<div class="dl-msg">💬 ${esc(d.msg)}</div>`:''}
    <div class="dl-forms">${f.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn coral" data-sfx onclick="sfx('open');S.view=(D.menus.find(m=>m.type==='letters')||{}).id||'home';S.ui={lt:'${d.l}'};render();scrollTo(0,0)">🎬 كيف أكتبه؟</button><button class="btn green" data-sfx onclick="sfx('open');dlPlay()">🎮 ${done?'العب مرة أخرى':'تحدي الحرف'}</button></div>
    <small class="muted" style="text-align:center">أتقنت ${dlCount(s.id)} من 28 حرفاً 🌟</small></div>`}
function pickDayLetter(){const d=dayLetter();
  form('🔤 اختر حرف اليوم',[{k:'l',label:'الحرف الذي ندرسه اليوم',type:'select',options:ALL_L.map(x=>[x.l,`${x.l} — حرف ${LNAME[x.l]} (${x.u.name})`]),value:d?d.l:'م'},{k:'msg',label:'رسالة قصيرة للطلاب (اختياري)',value:d&&d.msg||'',ph:'مثال: اكتب الحرف في دفترك ثلاث مرات ✏️'}],
  v=>{D.custom=Object.assign({},D.custom||{},{_dayletter:{l:v.l,msg:v.msg,t:Date.now()}});save();sfx('ex');toast('🔤 حرف اليوم: '+LNAME[v.l])})}
let DLG=null;
function dlPlay(){const d=dayLetter();if(!d)return;const l=d.l,others=ALL_L.map(x=>x.l).filter(x=>x!==l).sort(()=>Math.random()-.5);
  const opts=(right,wrong)=>[{t:right,ok:true},...wrong.map(t=>({t,ok:false}))].sort(()=>Math.random()-.5);
  DLG={l,i:0,score:0,qs:[
    {q:`أيّ صورة تبدأ بحرف ${l} ؟`,o:opts(`${LWORD[l][1]}<small>${LWORD[l][0]}</small>`,others.slice(0,3).map(x=>`${LWORD[x][1]}<small>${LWORD[x][0]}</small>`))},
    {q:`أين حرف ${LNAME[l]} ؟`,o:opts(l,others.slice(3,6))},
    {q:`حرف ${l} في أول الكلمة يُكتب هكذا:`,o:opts(lForms(l)[1],others.slice(6,9).map(x=>lForms(x)[1]))}]};dlStep()}
function dlStep(){const q=DLG.qs[DLG.i];DLG.lock=false;
  modal(`<div class="modal-h"><h3>🔤 تحدي حرف ${LNAME[DLG.l]}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>
  <div class="progress"><i style="width:${DLG.i/3*100}%"></i></div><div class="row" style="justify-content:space-between"><small class="muted">سؤال ${DLG.i+1} من 3</small><b>⭐ ${DLG.score}</b></div>
  <div class="game-q">${q.q}</div><div class="game-opts">${q.o.map((o,k)=>`<button class="game-opt dl-opt" onclick="dlPick(${k},this)">${o.t.includes('<small>')?o.t.replace('<small>','<span>').replace('</small>','</span>'):`<b class="dl-optl">${o.t}</b>`}</button>`).join('')}</div>`)}
function dlPick(k,el){if(DLG.lock)return;DLG.lock=true;const q=DLG.qs[DLG.i];const r=q.o.findIndex(o=>o.ok);document.querySelectorAll('.dl-opt')[r].classList.add('good');
  if(q.o[k].ok){DLG.score++;sfx('good')}else{el.classList.add('wrong');sfx('weak')}DLG.i++;
  setTimeout(()=>{if(DLG.i<3)return dlStep();const s=me();if(s){D.scores.push({id:uid(),sid:s.id,gid:'dl_'+DLG.l,score:DLG.score,max:3,kind:'letter',t:Date.now()});save()}
    if(DLG.score===3)confetti(70);sfx(DLG.score===3?'ex':'good');
    modal(`<div class="story"><div class="scene">${DLG.score===3?'🏆🔤':DLG.score?'⭐👏':'💪🙂'}</div><h2>${DLG.score===3?'ممتاز! أتقنت حرف '+LNAME[DLG.l]:DLG.score?'أحسنت!':'حاول مرة أخرى'}</h2><p>${DLG.score} من 3</p>${s?'':'<small class="muted">(وضع المعلم: لا تُحفظ النتيجة)</small>'}
    <div class="row" style="justify-content:center"><button class="btn green" onclick="dlPlay()">العب مرة أخرى</button><button class="btn ghost" onclick="closeLayer();render()">إغلاق</button></div></div>`)},900)}

function unitCover(name){const key='_ucover_'+name,cv=D.custom&&D.custom[key];

/* ---------- تحفيز القراءة: أسئلة الفهم، الرتب، الشهادة، اقرأ لي ---------- */
const STORY_QS={
  rabbit:[['مَاذَا يُحِبُّ الْأَرْنَبُ؟',['🥕 الْجَزَرَ','🍎 التُّفَّاحَ','🍌 الْمَوْزَ']],['لِمَنْ كَانَتِ السَّلَّةُ؟',['🦊 لِلثَّعْلَبِ','🐻 لِلدُّبِّ','🐱 لِلْقِطَّةِ']],['مَاذَا فَعَلَ الْأَرْنَبُ بِالسَّلَّةِ؟',['🤝 أَعَادَهَا','🍽️ أَكَلَهَا','🙈 خَبَّأَهَا']]],
  star:[['أَيْنَ تَعِيشُ النَّجْمَةُ؟',['🌌 فِي السَّمَاءِ','🌊 فِي الْبَحْرِ','🌳 فِي الْغَابَةِ']],['مَنْ صَارَ صَدِيقَ النَّجْمَةِ؟',['🌙 الْقَمَرُ','☁️ الْغَيْمَةُ','☀️ الشَّمْسُ']],['كَيْفَ كَانَتِ النَّجْمَةُ فِي الْبِدَايَةِ؟',['😢 وَحِيدَةً','😡 غَاضِبَةً','😴 نَائِمَةً']]]};
function fixStoryQs(){if((SYNC.role!=='admin'&&!isAdmin())||(D.custom&&D.custom._stories_qs))return;
  (D.stories||[]).forEach(st=>{if(st.qs&&st.qs.length)return;if(st.title==='الْأَرْنَبُ الصَّادِقُ')st.qs=JSON.parse(JSON.stringify(STORY_QS.rabbit));if(st.title==='نَجْمَةٌ تَبْحَثُ عَنْ صَدِيقٍ')st.qs=JSON.parse(JSON.stringify(STORY_QS.star))});
  D.custom=Object.assign({},D.custom||{},{_stories_qs:true});save()}
function parseQs(t){return String(t||'').split(/\n+/).map(l=>l.split('|').map(x=>x.trim()).filter(Boolean)).filter(a=>a.length>=3).map(a=>[a[0],a.slice(1,5)])}
const qsText=qs=>(qs||[]).map(q=>[q[0],...q[1]].join(' | ')).join('\n');
const RANKS=[{n:3,name:'قارئ برونزي',e:'🥉',c:'#CD7F32'},{n:6,name:'قارئ فضي',e:'🥈',c:'#A8B4C4'},{n:10,name:'قارئ ذهبي',e:'🥇',c:'#E9B530'}];
const storyIds=()=>new Set((D.stories||[]).map(s=>s.id));
function readsOf(sid){const ids=storyIds(),m=new Map();(D.scores||[]).filter(x=>x.sid===sid&&ids.has(x.gid)).forEach(x=>{const o=m.get(x.gid);if(!o||x.score/x.max>o.score/o.max)m.set(x.gid,x)});return m}
const rankOf=n=>[...RANKS].reverse().find(r=>n>=r.n)||null;
const nextRank=n=>RANKS.find(r=>n<r.n)||null;
const readSub=(sid,stId)=>(D.subs||[]).filter(x=>x.sid===sid&&x.aid==='r_'+stId).sort((a,b)=>b.t-a.t)[0];
/* بعد آخر صفحة */
let SQ=null;
function finishStory(id){const st=D.stories.find(x=>x.id===id);if(!st)return;if(st.qs&&st.qs.length){SQ={id,i:0,score:0,order:st.qs.map(q=>{const o=q[1].map((t,k)=>({t,ok:k===0}));return o.sort(()=>Math.random()-.5)})};return quizStep()}completeStory(id,0,0)}
function quizStep(){const st=D.stories.find(x=>x.id===SQ.id);const q=st.qs[SQ.i];const opts=SQ.order[SQ.i];SQ.lock=false;
  modal(`<div class="modal-h"><h3>🧠 أسئلة القصة</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>
  <div class="progress"><i style="width:${SQ.i/st.qs.length*100}%"></i></div><div class="row" style="justify-content:space-between"><small class="muted">سؤال ${SQ.i+1} من ${st.qs.length}</small><b>⭐ ${SQ.score}</b></div>
  <div class="game-q st-q">${esc(q[0])}</div><div class="qz-opts">${opts.map((o,k)=>`<button class="game-opt qz-opt" onclick="quizPick(${k},this)"><span>${esc(o.t)}</span></button>`).join('')}</div>`)}
function quizPick(k,el){if(SQ.lock)return;SQ.lock=true;const opts=SQ.order[SQ.i];const right=opts.findIndex(o=>o.ok);document.querySelectorAll('.qz-opt')[right].classList.add('good');
  if(opts[k].ok){SQ.score++;sfx('good')}else{el.classList.add('wrong');sfx('weak')}
  SQ.i++;const st=D.stories.find(x=>x.id===SQ.id);setTimeout(()=>{SQ.i<st.qs.length?quizStep():completeStory(SQ.id,SQ.score,st.qs.length)},900)}
function completeStory(id,score,max){const st=D.stories.find(x=>x.id===id);const s=me();let newRank=null;
  if(s){const before=readsOf(s.id).size;D.scores.push({id:uid(),sid:s.id,gid:id,score:max?score:1,max:max||1,kind:'story',t:Date.now()});const after=readsOf(s.id).size;
    if(after>before){const r=RANKS.find(r=>r.n===after);if(r)newRank=r}save()}
  const full=max&&score===max;if(full||!max)confetti(60);sfx(full?'ex':'good');
  const rs=s&&readSub(s.id,id);

  ${max?`<p>أجبت ${score} من ${max} ⭐</p>`:''}${!s?'<small class="muted">(وضع المعلم: لا تُحفظ النتيجة)</small>':''}
  <div class="row" style="justify-content:center">${s&&!rs?`<button class="btn coral" data-sfx onclick="sfx('open');openRec('r_${id}')">🎙️ اقرأ القصة بصوتك</button>`:''}${newRank?`<button class="btn sun" onclick="showCert()">📜 شهادتي</button>`:''}<button class="btn ghost" onclick="closeLayer();render()">إغلاق</button></div></div>`)}

async function certURL(name,rank){const c=document.createElement('canvas');c.width=1400;c.height=990;const g=c.getContext('2d');

  g.lineWidth=18;g.strokeStyle=rank.c;g.strokeRect(30,30,1340,930);g.lineWidth=4;g.strokeStyle='#1B2A4A';g.strokeRect(62,62,1276,866);
  for(const [x,y] of [[110,110],[1290,110],[110,880],[1290,880]]){g.font='60px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('⭐',x,y)}
  g.direction='rtl';g.textAlign='center';g.fillStyle='#1B2A4A';
  g.font='800 46px "Baloo Bhaijaan 2",Tajawal,sans-serif';g.fillText('فصل الأبطال · مدرسة طارق بن زياد بالدمام',700,150);
  g.font='120px serif';g.fillText(rank.e,700,290);
  g.font='800 84px "Baloo Bhaijaan 2",Tajawal,sans-serif';g.fillStyle=rank.c;g.fillText('شهادة '+rank.name,700,420);
  g.fillStyle='#1B2A4A';g.font='700 40px Tajawal,sans-serif';g.fillText('تُمنح هذه الشهادة للبطل',700,515);
  g.font='800 92px "Baloo Bhaijaan 2",Tajawal,sans-serif';g.fillStyle='#2F8FF7';g.fillText(name,700,625);
  g.fillStyle='#1B2A4A';g.font='700 38px Tajawal,sans-serif';g.fillText(`لقراءته ${rank.n} قصص مصوّرة وفهمها، بارك الله فيه 🌟`,700,725);
  g.font='700 32px Tajawal,sans-serif';g.fillText(new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'}),700,800);
  g.font='800 40px "Baloo Bhaijaan 2",Tajawal,sans-serif';g.fillStyle='#6B4E00';g.fillText('المعلم: أ. مصطفى الهتلان',700,880);
  return c.toDataURL('image/jpeg',.9)}
async function showCert(sid){const s=sid?stu(sid):me();if(!s)return;const n=readsOf(s.id).size,r=rankOf(n);if(!r){toast('اقرأ 3 قصص لتحصل على أول شهادة 📚');return}

    <div class="row">${x.rating?`<span class="stamp ${RATING[x.rating].c}" style="font-size:15px;padding:2px 8px">${RATING[x.rating].e} ${RATING[x.rating].t}</span>`:'<span class="pill warn">⏳ بانتظارك</span>'}<button class="btn sm green" onclick="openReview('${x.id}')">🎧 استماع وتقييم</button></div></div>`}).join('')||'<p class="muted">لا توجد تسجيلات بعد</p>'}</div></details>

function reportReading(s){const m=readsOf(s.id),n=m.size,r=rankOf(n);const qz=[...m.values()].filter(x=>x.max>1);const avg=qz.length?Math.round(qz.reduce((a,x)=>a+x.score/x.max,0)/qz.length*100):null;
  const recs=(D.subs||[]).filter(x=>x.sid===s.id&&String(x.aid).startsWith('r_')&&x.rating);
  return `<div class="card"><h3>📚 القراءة والإثراء</h3><div class="stats" style="margin-top:10px">${[['📚',n,'قصص قرأها','var(--teal)'],[r?r.e:'⭐',r?r.name:'لم يحصل على رتبة بعد','رتبته','var(--sun)'],['🧠',avg===null?'—':avg+'%','فهم القصص','var(--grape)'],['🎙️',recs.length,'قراءة بصوته قيّمها المعلم','var(--coral)']].map(x=>`<div class="card stat" style="box-shadow:none;background:var(--surface-2)"><span class="nav-ic" style="background:${x[3]}">${x[0]}</span><div><div class="n" style="font-size:22px">${x[1]}</div><small class="muted">${x[2]}</small></div></div>`).join('')}</div>
  ${recs.length?`<div class="row" style="margin-top:8px">${recs.slice(-5).map(x=>{const st=D.stories.find(y=>'r_'+y.id===x.aid);return `<span class="pill info">${RATING[x.rating].e} ${esc(st?st.title:'قصة')}</span>`}).join('')}</div>`:''}</div>`}

function parsePages(t){return String(t||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('|');return i>=0?[l.slice(0,i).trim(),l.slice(i+1).trim()]:['',l]}).filter(x=>x[1])}
function readStory(id,p){const st=D.stories.find(x=>x.id===id);const pg=st.pages[p];

  <div class="story">${pg[0]?`<div class="scene">${esc(pg[0])}</div>`:st.img?`<img class="story-img" src="${st.img}" alt="">`:`<div class="scene">${esc(st.cover||'📖')}</div>`}<p>${esc(pg[1])}</p><div class="dots">${st.pages.map((_,i)=>`<i class="${i===p?'on':''}"></i>`).join('')}</div>
  <div class="row">${p>0?`<button class="btn ghost" onclick="readStory('${id}',${p-1})">→ السابق</button>`:''}${p<st.pages.length-1?`<button class="btn" onclick="readStory('${id}',${p+1})">التالي ←</button>`:`<button class="btn green" onclick="finishStory('${id}')">انتهت القصة 🎉</button>`}</div></div>`)}
function addStory(){form('إضافة قصة مصوّرة',[{k:'title',label:'عنوان القصة (بالتشكيل)'},genBox('story'),{k:'cover',label:'رمز الغلاف',value:'📕'},{k:'img',label:'صورة الغلاف (اختياري)',type:'file',accept:'image/*',paste:true},{k:'pages',label:'الصفحات بالتشكيل الكامل حتى آخر حرف: كل سطر صفحة، بصيغة: الرسمة | النص',type:'textarea',rows:6,ph:'🐢🌳 | خرجت السلحفاة إلى الغابة\n🐢🐇 | قابلت الأرنب'},{k:'qs',label:'🧠 أسئلة الفهم (اختياري): كل سطر سؤال بصيغة: السؤال | الإجابة الصحيحة | خطأ | خطأ',type:'textarea',rows:4,ph:'مَاذَا يُحِبُّ الْأَرْنَبُ؟ | 🥕 الْجَزَرَ | 🍎 التُّفَّاحَ | 🍌 الْمَوْزَ'}],async v=>{const pages=parsePages(v.pages);if(!v.title||!pages.length)return 'أضف العنوان وصفحة واحدة على الأقل';D.stories.unshift({id:uid(),title:v.title,cover:v.cover||'📕',img:v.img?await coverFrom(v.img,640):'',qs:parseQs(v.qs),pages});save();toast('أُضيفت القصة')})}

    :`<p class="muted" style="margin:0">ارفع ملف CSV فيه عمود للاسم، ويمكن إضافة عمود ثانٍ لاسم المستخدم. (احفظ ملف Excel بصيغة CSV)</p><input class="input" type="file" id="cf" accept=".csv,text/csv"><button class="btn green" onclick="addCSV()">استيراد</button>`}
    <div class="hint">كل طالب جديد يحصل تلقائياً على: اسم مستخدم، رقم سري من 4 أرقام، وباركود دخول خاص. وولي الأمر يتابع من حساب ابنه.</div></div>`}
  afterRender.push(()=>D.students.forEach(s=>drawQR('qr_'+s.id,s)));

function cardHTML(s){return `<div class="qr-card"><b style="font-family:var(--f-display);font-size:20px">${esc(s.ava)} ${esc(s.name)}</b><div class="qr" id="qr_${s.id}"></div><div>المستخدم: <code>${esc(s.username)}</code></div><div>الرقم السري: <code>${esc(s.pin)}</code></div></div>`}
function drawQR(id,s){const el=document.getElementById(id);if(!el)return;if(!window.QRCode){el.innerHTML='<small style="display:grid;place-items:center;height:100%;text-align:center">تعذّر رسم الباركود، تحقق من الاتصال بالإنترنت ثم أعد فتح الصفحة</small>';return}el.innerHTML='';new QRCode(el,{text:'FASL1:'+s.qr,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}
function showCard(id){const s=stu(id);modal(`<div class="modal-h"><h3>بطاقة دخول الطالب</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>${cardHTML(s).replace('id="qr_','id="mqr_')}
  <div class="row"><button class="btn green" onclick="closeLayer();S.session=null;qrLogin('FASL1:${s.qr}')">📷 تجربة الدخول بالباركود</button><button class="btn ghost" onclick="newQR('${s.id}')">🔄 باركود جديد (يلغي القديم)</button></div>`);drawQR('mqr_'+s.id,s)}
function newQR(id){stu(id).qr=token();save();toast('تم توليد باركود جديد، البطاقة القديمة لم تعد تعمل');showCard(id)}
function resetPin(id){stu(id).pin=pin();save();S.ui.show=id;render();toast('تم توليد رقم سري جديد')}
function delStudent(id){D.students=D.students.filter(s=>s.id!==id);D.recs=D.recs.filter(r=>r.sid!==id);D.scores=D.scores.filter(r=>r.sid!==id);D.heroes=D.heroes.filter(r=>r.sid!==id);D.subs.filter(x=>x.sid===id).forEach(x=>STORE.del(x.id));D.subs=D.subs.filter(x=>x.sid!==id);D.threads=D.threads.filter(t=>t.sid!==id);save();render();toast('تم الحذف')}
const TR={'ا':'a','أ':'a','إ':'e','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'w','ي':'y','ى':'a','ء':'','ئ':'e','ؤ':'o'};
function mkUser(name,want){let u=(want||[...name].map(c=>TR[c]??(/[a-z0-9]/i.test(c)?c:'')).join('')).toLowerCase().replace(/[^a-z0-9]/g,'')||'student';let b=u,i=2;while(D.students.some(s=>s.username===u))u=b+i++;return u}
function newStudent(name,u){const s={id:uid(),name,username:mkUser(name,u),pin:pin(),qr:token(),parent:'P-'+token(6).toUpperCase(),ava:AVAS[rnd(AVAS.length)],star:false,created:Date.now()};D.students.push(s);return s}
function addOne(){const n=$('#n1').value.trim();if(!n)return toast('اكتب اسم الطالب');newStudent(n,$('#u1').value.trim());save();S.ui.st='cards';render();toast('أُضيف الطالب ✅')}
function addList(){const ns=$('#nl').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!ns.length)return toast('الصق الأسماء أولاً');ns.forEach(n=>newStudent(n));save();S.ui.st='cards';render();toast(`أُضيف ${ns.length} طالب ✅`)}
function addCSV(){const f=$('#cf').files[0];if(!f)return toast('اختر الملف');const fr=new FileReader();fr.onload=()=>{const rows=fr.result.replace(/^﻿/,'').split(/\r?\n/).map(l=>l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r[0]&&!/^(name|الاسم|اسم)$/i.test(r[0]));rows.forEach(r=>newStudent(r[0],r[1]));save();S.ui.st='cards';render();toast(`استُورد ${rows.length} طالب ✅`)};fr.readAsText(f,'utf-8')}

/* Security */

/* ---------- تخزين الملفات الصوتية (IndexedDB) ---------- */
const IDB={p:null,
  open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open(KEY+'_audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
  async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction('a').objectStore('a').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async del(k){try{const d=await this.open();await new Promise(res=>{const t=d.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=res;t.onerror=res;t.onabort=res})}catch(e){}}
};
const blobToDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
/* صوت نموذجي للتسليمات التجريبية فقط */
function demoWav(seed){const sr=8000,sec=6,n=sr*sec,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const notes=[392,440,494,440,392,349,392,440].map(f=>f*(1+(seed%3)*.06));for(let i=0;i<n;i++){const k=Math.floor(i/(n/notes.length)),ph=(i%(n/notes.length))/(n/notes.length);const env=Math.sin(Math.PI*ph)*.35;v.setInt16(44+i*2,Math.sin(2*Math.PI*notes[k]*i/sr)*env*32767,true)}
  return new Blob([buf],{type:'audio/wav'})}
let objURLs=[];
async function srcFor(sub){try{if(sub.inline)return sub.inline;if(sub.demo){const u=URL.createObjectURL(demoWav(sub.t%7));objURLs.push(u);return u}const b=await STORE.get(sub.id);if(!b)return null;const u=URL.createObjectURL(b);objURLs.push(u);return u}catch(e){return null}}

function bindPlayer(pid,src,hint){
  const el=document.getElementById(pid);if(!el)return;const a=el.querySelector('audio'),seek=el.querySelector('.pl-seek'),cur=el.querySelector('.cur'),tot=el.querySelector('.tot'),pb=el.querySelector('[data-a="play"]');
  if(!src){el.innerHTML='<p class="muted" style="margin:0">⚠️ الملف الصوتي غير موجود على هذا الجهاز.</p>';return}
  let fixing=false,drag=false;
  const dur=()=>isFinite(a.duration)&&a.duration>0?a.duration:(hint||0);
  const upd=()=>{const d=dur();cur.textContent=mmss(a.currentTime);tot.textContent=mmss(d);if(!drag)seek.value=d?Math.round(a.currentTime/d*1000):0};
  a.addEventListener('loadedmetadata',()=>{if(!isFinite(a.duration)){fixing=true;try{a.currentTime=1e7}catch(e){fixing=false}}upd()});
  a.addEventListener('timeupdate',()=>{if(fixing){fixing=false;a.currentTime=0}upd()});
  a.addEventListener('durationchange',upd);
  a.addEventListener('play',()=>{pb.textContent='⏸️';pb.setAttribute('aria-label','إيقاف مؤقت')});
  a.addEventListener('pause',()=>{pb.textContent='▶️';pb.setAttribute('aria-label','تشغيل')});
  a.addEventListener('ended',()=>{pb.textContent='▶️';upd()});
  a.addEventListener('error',()=>{tot.textContent='تعذّر التشغيل'});
  seek.addEventListener('input',()=>{drag=true;const d=dur();cur.textContent=mmss(seek.value/1000*d)});
  seek.addEventListener('change',()=>{const d=dur();if(d)a.currentTime=seek.value/1000*d;drag=false});
  el.querySelector('.pl-vol').addEventListener('input',e=>{a.volume=+e.target.value;a.muted=false;el.querySelector('[data-a="mute"]').textContent=a.volume?'🔊':'🔇'});
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const act=b.dataset.a;
    if(b.dataset.r){a.playbackRate=+b.dataset.r;try{a.preservesPitch=true}catch(_){}el.querySelectorAll('.pl-rate').forEach(x=>x.classList.toggle('on',x===b));return}
    if(act==='play'){if(a.paused){a.play().catch(()=>toast('اضغط تشغيل مرة أخرى'))}else a.pause()}
    else if(act==='back')a.currentTime=Math.max(0,a.currentTime-5);
    else if(act==='fwd'){const d=dur();a.currentTime=d?Math.min(d,a.currentTime+5):a.currentTime+5}
    else if(act==='restart'){a.currentTime=0;a.play().catch(()=>{})}
    else if(act==='loop'){a.loop=!a.loop;b.style.background=a.loop?'var(--sun)':''}
    else if(act==='mute'){a.muted=!a.muted;b.textContent=a.muted?'🔇':'🔊'}

}

const REC={st:'idle',mr:null,stream:null,chunks:[],t0:0,acc:0,raf:0,an:null,src:null,blob:null,mime:'',dur:0,err:'',aid:null,cd:null,tick:null,confirm:false,discard:false};
function pickMime(){if(!window.MediaRecorder)return null;for(const m of ['audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/mp4;codecs=opus']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return null}
const fmtName=m=>/opus/i.test(m||'')?'Opus':((m||'').split(';')[0].split('/')[1]||'صوت').toUpperCase();
function elapsed(){return (REC.acc+(REC.st==='rec'?performance.now()-REC.t0:0))/1000}
function stopStream(){cancelAnimationFrame(REC.raf);clearInterval(REC.tick);if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null}if(REC.src){try{REC.src.disconnect()}catch(e){}REC.src=null}REC.an=null}
function cleanupRec(){clearInterval(REC.cd);if(REC.mr){REC.mr._discard=true;if(REC.mr.state!=='inactive'){try{REC.mr.stop()}catch(e){}}}stopStream();REC.mr=null;REC.st='idle';REC.blob=null;REC.err='';REC.confirm=false;stopPlayers();objURLs.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});objURLs=[]}

  if(REC.st!=='idle')return;REC.err='';const mime=pickMime();
  if(mime===null||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){REC.err='unsupported';return drawRec()}
  REC.st='asking';drawRec();let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){REC.st='idle';REC.err=(e&&e.name==='NotFoundError')?'nomic':'denied';return drawRec()}
  if(REC.st!=='asking'||!document.getElementById('recArea')){st.getTracks().forEach(t=>t.stop());return}
  REC.stream=st;
  REC.st='count';let n=3;drawRec(n);sfx('beep');
  REC.cd=setInterval(()=>{n--;if(n>0){drawRec(n);sfx('beep')}else{clearInterval(REC.cd);sfx('go');setTimeout(beginRec,180)}},800);
}
function beginRec(){
  if(REC.st!=='count'||!REC.stream)return;
  const mime=pickMime();const opts={audioBitsPerSecond:32000};if(mime)opts.mimeType=mime;
  let mr;if(!mime){REC.err='unsupported';stopStream();REC.st='idle';return drawRec()}try{mr=new MediaRecorder(REC.stream,opts)}catch(e){REC.err='unsupported';stopStream();REC.st='idle';return drawRec()}
  REC.mr=mr;const chunks=[];REC.mime=mr.mimeType||mime||'audio/webm';const mtype=REC.mime;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{if(mr._discard||REC.mr!==mr)return;stopStream();const b=new Blob(chunks,{type:mtype});if(!b.size){REC.err='empty';REC.st='idle';REC.mr=null;return drawRec()}REC.blob=b;REC.st='done';REC.mr=null;drawRec()};
  mr.onerror=()=>{if(REC.mr!==mr)return;REC.err='failed';cleanupRec();drawRec()};
  try{mr.start(1000)}catch(e){REC.err='failed';cleanupRec();return drawRec()}REC.st='rec';REC.t0=performance.now();REC.acc=0;
  try{const a=ac();if(a){REC.src=a.createMediaStreamSource(REC.stream);REC.an=a.createAnalyser();REC.an.fftSize=256;REC.src.connect(REC.an)}}catch(e){REC.an=null}
  drawRec();REC.tick=setInterval(()=>{const t=document.getElementById('rtime');if(t)t.textContent=mmss(elapsed());if(REC.st==='rec'&&elapsed()>=600){toast('وصلت للحد الأقصى (10 دقائق)');stopRec()}},250);
}
function pauseRec(){if(REC.st!=='rec'||!REC.mr)return;try{REC.mr.pause()}catch(e){return}REC.acc+=performance.now()-REC.t0;REC.st='paused';sfx('pause');drawRec()}

function meter(){cancelAnimationFrame(REC.raf);const c=document.getElementById('meter');if(!c||!REC.an||REC.st!=='rec')return;const g=c.getContext('2d'),W=c.width=c.clientWidth*2,H=c.height=c.clientHeight*2;const data=new Uint8Array(REC.an.frequencyBinCount);const col=getComputedStyle(document.documentElement).getPropertyValue('--grass').trim()||'#2FB872';
  const loop=()=>{if(REC.st!=='rec'||!REC.an||!c.isConnected)return;REC.an.getByteFrequencyData(data);g.clearRect(0,0,W,H);const n=32,bw=W/n;g.fillStyle=col;for(let i=0;i<n;i++){const v=data[Math.floor(i*data.length/n/1.5)]/255;const h=Math.max(6,v*H*.95);g.beginPath();if(g.roundRect)g.roundRect(i*bw+3,(H-h)/2,bw-6,h,6);else g.rect(i*bw+3,(H-h)/2,bw-6,h);g.fill()}REC.raf=requestAnimationFrame(loop)};loop()}

const realAsg=id=>D.assign.some(a=>a.id===id);

  if(!d._v2&&d.students.length){d._v2=1;const now=Date.now(),day=864e5,ds=n=>new Date(now+n*day).toISOString().slice(0,10),S_=d.students;

    const a2={id:uid(),title:'مراجعة سورة قريش',surah:'قريش',range:'السورة كاملة',note:'',due:ds(1),open:true,t:now-4*day};

    d.assign.push(a1,a2,a3);
    S_.slice(1,6).forEach((s,i)=>d.subs.push({id:uid(),aid:a1.id,sid:s.id,t:now-(i+1)*36e5,dur:6,mime:'audio/wav',size:96000,demo:true,rating:i<2?(i?'good':'ex'):null,seen:true}));
    d.subs.push({id:uid(),aid:a2.id,sid:S_[0].id,t:now-day,dur:6,mime:'audio/wav',size:96000,demo:true,rating:'ex',ratedAt:now-2*36e5,seen:false});
    S_.slice(0,7).forEach((s,i)=>d.subs.push({id:uid(),aid:a3.id,sid:s.id,t:now-8*day,dur:6,mime:'audio/wav',size:96000,demo:true,rating:['ex','good','ex','weak','good','ex','good'][i],seen:true}));

    d.notifs.unshift({id:uid(),t:now-36e5,read:false,text:'🎙️ 3 تسليمات قرآن جديدة بانتظار تقييمك',go:'quran'});

}
function badgeFor(m){
  if(isAdmin()){if(m.type==='quran')return D.subs.filter(x=>!x.rating&&realAsg(x.aid)).length;if(m.type==='enrich')return D.subs.filter(x=>!x.rating&&String(x.aid).startsWith('r_')).length;if(m.type==='suggest')return D.threads.filter(t=>!t.readT).length;return 0}
  const s=me();if(!s)return 0;
  if(m.type==='quran')return D.assign.filter(a=>a.open&&!subOf(a.id,s.id)).length+D.subs.filter(x=>x.sid===s.id&&x.rating&&!x.seen&&realAsg(x.aid)).length;
  if(m.type==='enrich')return D.subs.filter(x=>x.sid===s.id&&x.rating&&!x.seen&&String(x.aid).startsWith('r_')).length;
  if(m.type==='suggest')return D.threads.filter(t=>t.sid===s.id&&!t.readS).length;return 0}

    <div class="progress"><i style="width:${N?subs.length/N*100:0}%"></i></div><small class="muted">سلّم ${subs.length} من ${N} طالب${pend?` · <b style="color:var(--warn)">${pend} بانتظار تقييمك</b>`:''}</small>

  return `<div class="row"><button class="btn ghost sm" onclick="S.ui.pa=null;render()">→ كل الواجبات</button></div>
  <div class="card asg"><h4>${esc(a.title)}</h4>${asgMeta(a)}<small class="muted">سلّم ${done} من ${rows.length} · لم يسلّم ${rows.length-done}</small></div>
  <div class="sec-list">${rows.map(({s,x})=>`<div class="subrow"><div class="row">${ava(s)}<div><b>${esc(s.name)}</b><br><small class="muted">${x?(x.inclass?`🏫 سمّع في الصف · ${fmt(x.t)}`:`${fmt(x.t)} · ⏱️ ${mmss(x.dur)} · ${fmtName(x.mime)}`):'لم يسلّم بعد'}</small></div></div>
    <div class="row">${x?(x.rating?`<span class="stamp ${RATING[x.rating].c}" style="font-size:16px;padding:2px 10px">${RATING[x.rating].e} ${RATING[x.rating].t}</span>`:'<span class="pill warn">⏳ بانتظار تقييمك</span>')+(x.inclass?`<button class="btn sm" data-sfx onclick="sfx('open');classRate('${s.id}','${a.id}')">✏️ تغيير التقييم</button>`:`<button class="btn sm green" data-sfx onclick="sfx('open');openReview('${x.id}')">🎧 استماع وتقييم</button><button class="btn sm ghost" onclick="confirmBox('حذف تسجيل هذا الطالب؟',()=>delSub('${x.id}'))" aria-label="حذف التسجيل">🗑️</button>`):`<span class="pill bad">لم يسلّم</span><button class="btn sm" data-sfx onclick="sfx('open');classRate('${s.id}','${a.id}')">🏫 قيّم (سمّع في الصف)</button>`}</div></div>`).join('')}</div>`}
function toggleDoor(id){const a=asg(id);a.open=!a.open;save();sfx(a.open?'open':'stop');render();toast(a.open?'🔓 فُتح الباب للطلاب':'🔒 أُغلق الباب')}

function surahSub(sid,x){const ids=new Set((D.assign||[]).filter(a=>String(a.surah||'').trim()===x).map(a=>a.id));return (D.subs||[]).filter(s=>s.sid===sid&&ids.has(s.aid)).sort((a,b)=>(b.ratedAt||b.t||0)-(a.ratedAt||a.t||0))[0]}
function classRate(sid,aid){const a=asg(aid),st=stu(sid);if(!a)return;const x=subOf(aid,sid);
  modal(`<div class="modal-h"><h3>${ava(st)} ${esc(st.name)}</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>

    <div class="tabs"><button class="${t==='pw'?'on':''}" onclick="S.ui.stTab='pw';render()">اسم المستخدم</button><button class="${t==='qr'?'on':''}" onclick="S.ui.stTab='qr';render()">الباركود 📷</button></div>
    ${t==='pw'?`<form id="lf" style="display:grid;gap:12px"><label class="f">اسم المستخدم<input class="input" id="lu" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="f">الرقم السري<input class="input" id="lp" type="password" inputmode="numeric" dir="ltr" autocomplete="current-password" required></label>
      <div class="err" id="le"></div><button class="btn green" id="lb">ادخل 🚀</button></form>
      <div class="hint">👨‍👩‍👦 ولي الأمر يدخل بحساب ابنه نفسه، ويجد «تقرير ولي الأمر» في القائمة.</div>`
    :`<p class="muted" style="margin:0">صوّر بطاقة الباركود الخاصة بك بكاميرا الجهاز.</p>
      <button class="btn green" type="button" data-sfx onclick="sfx('open');liveScan()" style="font-size:18px;padding:14px">📹 امسح الباركود بالكاميرا</button>
      <label class="btn ghost" style="text-align:center">📷 أو صوّر البطاقة<input type="file" accept="image/*" capture="environment" hidden onchange="scanQR(this.files[0]);this.value=''"></label>
      <div class="err" id="le"></div>`}
    <button class="btn ghost" onclick="S.ui.door=null;render()">← رجوع</button></div>`}
  else if(m==='ad'){body=`<div class="card login-form">
    <h2>🧑‍🏫 دخول المعلم</h2>
    <form id="af" style="display:grid;gap:12px"><label class="f">البريد الإلكتروني<input class="input" id="ae" type="email" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="f">كلمة المرور<input class="input" id="ap" type="password" dir="ltr" autocomplete="current-password" required></label>
    <div class="err" id="le"></div><button class="btn grape" id="ab">دخول</button></form>
    <button class="btn ghost" onclick="S.ui.door=null;render()">← رجوع</button></div>`}
  $('#app').innerHTML=`<main class="login"><div class="login-box">
    <div class="brand-hero"><div class="mascot">🦸‍♂️</div><h1>فصل <span>الأبطال</span></h1><p class="muted" style="margin:0;font-size:18px">منصة الصف الأول الابتدائي: نتعلم ونلعب ونتميز</p><p class="school">🏫 مدرسة طارق بن زياد بالدمام</p></div>${body}<p class="credit">جميع الحقوق محفوظة © ${new Date().getFullYear()} · إعداد وتصميم <b>أ. مصطفى الهتلان</b></p></div></main>`;
  const lf=$('#lf'),af=$('#af');
  if(lf)lf.onsubmit=async e=>{e.preventDefault();const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value.trim();busyBtn('#lb',true);await studentAuth(()=>sb.rpc('student_login',{p_username:u,p_pin:p}));busyBtn('#lb',false)};
  if(af)af.onsubmit=async e=>{e.preventDefault();busyBtn('#ab',true);const err=t=>{const x=$('#le');if(x)x.textContent=t};
    try{const {error}=await sb.auth.signInWithPassword({email:$('#ae').value.trim(),password:$('#ap').value});
      if(error){err(/rate|many/i.test(error.message)?'محاولات كثيرة، انتظر قليلاً ثم حاول':'البريد أو كلمة المرور غير صحيحة');return}
      const {data:ok,error:e2}=await sb.rpc('claim_teacher');if(e2||!ok){await sb.auth.signOut();err('هذا الحساب ليس حساب المعلم');return}
      await startData('admin');login('admin','admin')}catch(x){err('تعذّر الاتصال، تحقق من الإنترنت')}finally{busyBtn('#ab',false)}};
}
function busyBtn(sel,on){const b=$(sel);if(b){b.disabled=on;b.style.opacity=on?.6:1}}
async function ensureAnon(){const {data:{session}}=await sb.auth.getSession();if(session&&session.user&&session.user.is_anonymous)return true;if(session)await sb.auth.signOut();const {error}=await sb.auth.signInAnonymously();return !error}
async function studentAuth(call,mode){
  const err=t=>{const x=$('#le');if(x)x.textContent=t;else toast(t)};
  try{if(!await ensureAnon()){err('تعذّر الاتصال، تحقق من الإنترنت');return}
    const {data,error}=await call();if(error){err('تعذّر الاتصال، حاول مرة أخرى');return}
    if(!data||!data.ok){err(data&&data.error==='locked'?'محاولات خاطئة كثيرة. انتظر 10 دقائق ثم حاول':mode==='qr'?'قرأنا الباركود لكن البطاقة غير صالحة، ربما أُلغيت وصدرت بطاقة جديدة. اطلب بطاقتك الحالية من المعلم.':'اسم المستخدم أو الرقم السري غير صحيح');return}
    await startData('student');closeLayer();login('student',data.id)}catch(x){err('تعذّر الاتصال، تحقق من الإنترنت')}
}
/* ---------- قراءة الباركود: كاميرا مباشرة + صورة ---------- */
const QRS={stream:null,raf:0,busy:false,det:null};
function qrDecodeCanvas(c){const g=c.getContext('2d',{willReadFrequently:true});const d=g.getImageData(0,0,c.width,c.height);
  const r=window.jsQR?jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'}):null;return r&&r.data?r.data:null}
function qrFromImage(im){
  const W=im.naturalWidth||im.width,H=im.naturalHeight||im.height;
  for(const max of [1400,900,2000,600]){const k=Math.min(1,max/Math.max(W,H));const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const r=qrDecodeCanvas(c);if(r)return r}
  for(const f of [.6,.4]){const cw=W*f,ch=H*f,k=Math.min(1,1000/Math.max(cw,ch));const c=document.createElement('canvas');c.width=Math.round(cw*k);c.height=Math.round(ch*k);c.getContext('2d').drawImage(im,(W-cw)/2,(H-ch)/2,cw,ch,0,0,c.width,c.height);const r=qrDecodeCanvas(c);if(r)return r}
  return null}
async function scanQR(file){if(!file)return;const e=$('#le');if(e)e.textContent='⏳ نقرأ البطاقة...';
  let data=null;try{if('BarcodeDetector' in window){const bd=new BarcodeDetector({formats:['qr_code']});const bm=await createImageBitmap(file);const r=await bd.detect(bm);if(r&&r[0])data=r[0].rawValue}}catch(x){}
  if(!data){try{const url=URL.createObjectURL(file);const im=new Image();im.src=url;await im.decode();data=qrFromImage(im);URL.revokeObjectURL(url)}catch(x){}}
  if(!data){if(e)e.textContent='ما قدرنا نقرأ الباركود من الصورة. قرّب الجوال من البطاقة حتى يملأ الباركود الصورة، أو جرّب «المسح المباشر».';return}
  qrLogin(data)}
function stopScan(){cancelAnimationFrame(QRS.raf);if(QRS.stream){QRS.stream.getTracks().forEach(t=>t.stop());QRS.stream=null}}
async function liveScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const e=$('#le');if(e)e.textContent='هذا الجهاز لا يدعم المسح المباشر، استخدم «تصوير البطاقة».';return}
  modal(`<div class="modal-h"><h3>📷 وجّه الكاميرا نحو الباركود</h3><button class="icon-btn" onclick="stopScan();closeLayer()" aria-label="إغلاق">✖️</button></div>
  <div class="scan-box"><video id="scv" playsinline muted autoplay></video><div class="scan-frame"></div></div><p class="muted" id="scm" style="margin:0;text-align:center">ضع الباركود داخل المربع وثبّت الجوال</p>`);
  try{QRS.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(x){const m=$('#scm');if(m)m.textContent='لم يُسمح باستخدام الكاميرا. اسمح بها من إعدادات المتصفح، أو استخدم «تصوير البطاقة».';return}
  const v=$('#scv');if(!v){stopScan();return}v.srcObject=QRS.stream;try{await v.play()}catch(x){}
  try{if('BarcodeDetector' in window)QRS.det=new BarcodeDetector({formats:['qr_code']})}catch(x){QRS.det=null}
  const c=document.createElement('canvas');let last=0;
  const loop=async t=>{if(!QRS.stream||!v.isConnected)return stopScan();QRS.raf=requestAnimationFrame(loop);if(t-last<220||QRS.busy||!v.videoWidth)return;last=t;QRS.busy=true;
    try{let data=null;if(QRS.det){const r=await QRS.det.detect(v);if(r&&r[0])data=r[0].rawValue}
      if(!data){const k=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);data=qrDecodeCanvas(c)}
      if(data){stopScan();sfx('ex');closeLayer();qrLogin(data)}}catch(x){}finally{QRS.busy=false}};
  QRS.raf=requestAnimationFrame(loop)}
function qrLogin(data){const raw=String(data||'').trim();const e=$('#le');
  if(!/^FASL1:/i.test(raw)){if(e)e.textContent='هذا الباركود ليس بطاقة دخول المنصة.';return}
  const t=raw.replace(/^FASL1:/i,'').trim();if(e)e.textContent='⏳ جارٍ الدخول...';
  studentAuth(()=>sb.rpc('student_login_qr',{p_token:t}),'qr')}
async function logout(){const role=SYNC.role;S.session=null;saveSess();SYNC.role=null;SYNC.ready=false;SYNC.synced={};D=emptyD();S.ui={};closeLayer();render();
  try{if(role==='student')await sb.rpc('student_logout');else await sb.auth.signOut()}catch(e){}}
function showCard(id){const s=stu(id);modal(`<div class="modal-h"><h3>بطاقة دخول الطالب</h3><button class="icon-btn" onclick="closeLayer()" aria-label="إغلاق">✖️</button></div>${cardHTML(s).replace('id="qr_','id="mqr_')}
  <div class="row"><button class="btn ghost" onclick="newQR('${s.id}')">🔄 باركود جديد (يلغي القديم)</button></div>`);drawQR('mqr_'+s.id,s)}
function vSecurity(){
  const L=[['🔐','حسابات محمية','دخول المعلم بالبريد وكلمة مرور مشفّرة لدى Supabase، ولا تُحفظ في كود الموقع.'],
    ['🚫','قفل بعد 8 محاولات خاطئة','يتوقف دخول الطالب 10 دقائق لمنع التخمين.'],
    ['⏱️','خروج تلقائي','بعد 20 دقيقة دون استخدام.'],
    ['🪪','باركود عشوائي لكل طالب','يمكن إلغاؤه وتوليد بديل فوراً عند ضياع البطاقة.'],
    ['👁️','عزل البيانات','الطالب يرى تسجيلاته ورسائله فقط، ولا يرى أرقام زملائه السرية. والمعلم وحده يرى الكل.'],
    ['🙈','لا تسجيل ذاتي','إضافة الطلاب للمعلم فقط.'],
    ['🎙️','حماية التسجيلات','كل تسجيل في مجلد خاص بالطالب، لا يفتحه إلا هو والمعلم.']];
  return `<div class="sec-list">${L.map(x=>`<div class="sec-li"><span class="k">${x[0]}</span><div style="flex:1"><b>${x[1]}</b> <span class="pill ok">مفعّل</span><br><span class="muted">${x[2]}</span></div></div>`).join('')}</div>
  <div class="card" style="display:grid;gap:12px;max-width:520px"><h3>تغيير كلمة مرور المعلم</h3>
  <label class="f">كلمة المرور الجديدة (8 أحرف على الأقل)<input class="input" id="np" type="password" dir="ltr" autocomplete="new-password"></label>
  <label class="f">أعد كتابتها<input class="input" id="np2" type="password" dir="ltr" autocomplete="new-password"></label>
  <button class="btn grape" onclick="changeCreds()">حفظ</button></div>`;
}
async function changeCreds(){const p=$('#np').value,p2=$('#np2').value;if(p.length<8)return toast('كلمة المرور قصيرة (8 أحرف على الأقل)');if(p!==p2)return toast('كلمتا المرور غير متطابقتين');
  const {error}=await sb.auth.updateUser({password:p});if(error)return toast('تعذّر التغيير: '+(error.message||'').slice(0,60));$('#np').value='';$('#np2').value='';toast('تم تغيير كلمة المرور 🔐')}
async function resetAll(){toast('غير متاح في النسخة الفعلية')}

/* ---------- Render & boot ---------- */
function render(){document.querySelectorAll('.notif-panel').forEach(p=>p.remove());
  if(!S.session)return loginView();
  if(S.session.role==='student'&&!me())return logout();
  shell()}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if(S.session){S.session.last=Date.now();saveSess()}},{passive:true}));
setInterval(()=>{if(S.session&&Date.now()-S.session.last>20*60000){logout();toast('تم تسجيل الخروج تلقائياً لحمايتك')}},30000);
(async()=>{$('#app').innerHTML='<main class="login"><div class="brand-hero"><div class="mascot">🦸‍♂️</div><h2>جارٍ تحميل المنصة…</h2></div></main>';
  D=emptyD();
  if(!sb){$('#app').innerHTML='<main class="login"><div class="brand-hero"><div class="mascot">📡</div><h2>تعذّر الاتصال</h2><p class="muted">تحقق من الإنترنت ثم أعد تحميل الصفحة.</p></div></main>';return}
  try{const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){
      if(!session.user.is_anonymous){const {data:t}=await sb.rpc('is_teacher');if(t){await startData('admin');S.session={role:'admin',id:'admin',at:Date.now(),last:Date.now()}}else await sb.auth.signOut()}
      else{const {data:sid}=await sb.rpc('my_student_id');if(sid){await startData('student');if(me())S.session={role:'student',id:sid,at:Date.now(),last:Date.now()}}}}
  }catch(e){}
  saveSess();render()})();
</script>
